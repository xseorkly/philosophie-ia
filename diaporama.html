*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--teal)}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #d3943c;outline-offset:3px}h1,h2,h3,h4,p{margin-top:0}h1,h2,.serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.02em}h1{font-size:clamp(2.1rem,4vw,4rem);line-height:1.1}h2{font-size:clamp(1.7rem,2.7vw,2.6rem);line-height:1.2}h3{font-size:1.34rem}p{max-width:78ch}.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:850;color:var(--teal)}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{background:#122d36;color:#e6eff1;padding:28px 17px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}.sidebar .brand{padding:0 12px 20px}.brand strong{display:block;font:1.42rem Georgia,serif;letter-spacing:-.02em}.brand p{color:#b5c9c9;font-size:.82rem;margin:.65rem 0 0}.navtitle{margin:18px 12px 9px;font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:#a5c9be;font-weight:750}.atelier-link{display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;color:#d8e4e5;text-align:left;background:none;border:0;width:100%;line-height:1.23}.atelier-link:hover,.atelier-link.active{background:#24505a;color:white}.atelier-link .num{display:grid;place-items:center;min-width:29px;height:29px;border:1px solid #4f777d;border-radius:8px;color:#afdbd1;font-size:.75rem}.atelier-link b{font-weight:650;font-size:.9rem}.atelier-link small{display:block;color:#b6cbd0;font-size:.74rem;margin-top:5px}.tools{margin-top:auto;border-top:1px solid #34525d;padding:18px 10px}.tools button,.tools label{font-size:.79rem;display:block;width:100%;border:1px solid #5a7d84;color:white;background:transparent;padding:9px;border-radius:9px;text-align:left;margin:6px 0}.tools label input{width:100%;margin-top:5px;color:white;font-size:.75rem}.tools p{color:#aec4c7;font-size:.73rem}.stage{width:100%;padding:26px min(4vw,70px) 90px;max-width:1540px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--stroke);padding:0 0 17px;margin:0 0 24px}.toolbar a{text-decoration:none;font-size:.84rem;font-weight:700}.pill{border:1px solid var(--stroke);border-radius:999px;background:var(--paper);font-size:.75rem;color:var(--muted);padding:5px 10px}.workshop[hidden],.screen[hidden]{display:none!important}.cover,.intro,.panel,.activity,.synthesis,.resourcebox{background:var(--paper);border:1px solid var(--stroke);border-radius:18px;box-shadow:var(--shadow)}.cover{padding:clamp(23px,5vw,65px);background:linear-gradient(110deg,#fff 55%,#e8f4f0)}.cover .lead{font-size:1.15rem;max-width:58ch}.cover-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{background:var(--teal);color:white;border:1px solid var(--teal);border-radius:10px;padding:11px 17px;font-weight:750;display:inline-flex;align-items:center;gap:8px;text-decoration:none}.btn:hover{background:#0b4e4a}.btn.secondary{background:#fff;color:var(--teal);border-color:#9dc6bb}.btn.ghost{background:transparent;border:1px solid var(--stroke);color:var(--ink)}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px}.tile{border:1px solid var(--stroke);border-radius:13px;padding:21px;background:#fff;text-align:left;box-shadow:var(--shadow)}.tile:hover{border-color:#78afa4;transform:translateY(-1px)}.tile span{font-size:.75rem;color:var(--teal);font-weight:800}.tile h3{font-family:Georgia,serif;margin:9px 0 8px}.tile p{font-size:.89rem;color:var(--muted);margin:0}.intro{padding:clamp(22px,4vw,48px)}.intro h1{font-size:clamp(2rem,3.4vw,3.5rem);max-width:850px}.intro .problem{background:var(--teall);padding:17px 20px;border-left:4px solid var(--teal);border-radius:9px;font:1.1rem/1.5 Georgia,serif;max-width:none}.intent-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:23px}.intent-grid h3{font:800 .73rem/1.2 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}.intent-grid ul{padding-left:20px;margin-top:7px}.intent-grid li{margin-bottom:8px}.steps-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0}.steps-nav a{background:#fff;border:1px solid var(--stroke);padding:8px 11px;text-decoration:none;border-radius:9px;font-size:.83rem;color:var(--ink);font-weight:700}.steps-nav a:hover{border-color:var(--teal)}.activity{padding:clamp(19px,3vw,34px);margin:19px 0;scroll-margin-top:14px}.activity .step-tag{font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}.activity h3{font:1.6rem/1.25 Georgia,serif;margin:8px 0 12px}.scenario{background:var(--blue);border-radius:10px;padding:14px 17px;max-width:none}.activity-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:17px}.activity-grid h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:10px}.activity-grid ol{padding-left:20px;margin:0}.activity-grid li{margin-bottom:10px}.contract{background:#f7f8f5;border-radius:10px;border:1px solid var(--stroke);padding:15px}.focus{font-family:Georgia,serif;font-style:italic}.noai{font-size:.82rem;color:#6c502c;margin:15px 0;background:var(--goldl);padding:8px 12px;border-radius:7px}.promptblock,.promptbox{border:1px solid #b3cfc7;background:#f3faf7;border-radius:10px;padding:12px;margin-top:15px}.promptblock pre,.promptbox pre{overflow:auto;white-space:pre-wrap;font-size:.81rem;max-height:300px}.promptblock button,.promptbox button{font-size:.77rem;padding:7px 10px;border:1px solid var(--teal);border-radius:7px;background:white;color:var(--teal);font-weight:700}.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.toolgrid article{border:1px solid var(--stroke);border-radius:10px;padding:15px;background:#fff}.prompthead{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.79rem;font-weight:750}.correction-kit{padding:16px;background:white;border:1px solid var(--stroke);border-radius:10px;margin-top:14px}.correction-kit h3{margin:12px 0}.write{margin-top:19px}.write label{font-weight:800;font-size:.85rem;display:block;margin-bottom:8px}.write textarea,.matrix textarea{display:block;width:100%;resize:vertical;min-height:112px;border:1px solid #bbcaca;border-radius:9px;padding:12px;background:#fff}.write small{color:var(--muted);font-size:.72rem}.bilan{margin-top:16px;border:1px solid #dccbb3;background:#fffbf4;border-radius:9px}.bilan summary{list-style:none;padding:13px 15px;cursor:pointer;font-weight:750;font-size:.87rem}.bilan-inner{padding:0 17px 16px}.bilan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.bilan-cell{padding:13px;border-radius:8px;background:white;border:1px solid #eee0c7}.bilan-cell h5{font-size:.8rem;color:#794a1d;text-transform:uppercase;margin:0 0 6px}.bilan-cell p{font-size:.85rem;margin:0}.sourcesused{font-size:.78rem;margin:12px 0 0}.ref-pill,.cite{display:inline-block;background:#dceee8;border:1px solid #b8d6ce;color:#155c56;border-radius:5px;padding:0 5px;margin:0 2px;text-decoration:none;font-weight:750;font-size:.78rem}.endactivity{display:flex;justify-content:space-between;margin-top:15px;font-size:.83rem}.done{display:flex;gap:8px;align-items:center}.resourcebox{padding:20px;margin:20px 0}.resourcebox summary{cursor:pointer;font-weight:750}.resourcebox .copy-card{margin-top:12px;padding:11px;border:1px solid var(--stroke);border-radius:8px}.resourcebox p{max-width:none}.synthesis{padding:clamp(24px,4vw,46px);margin-top:29px;background:linear-gradient(145deg,#f8fdfb,#fff)}.synthesis h2{max-width:900px}.synthesis .theory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:23px 0}.theory-item{border:1px solid var(--stroke);border-radius:11px;padding:17px;background:white}.theory-item h3{font-size:1.1rem;margin-bottom:9px}.theory-item p{font-size:.91rem;max-width:none}.synthesis .sourcebar{margin-top:14px;font-size:.82rem}.nextbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0}.matrix{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:20px}.matrix label{font-weight:700;display:block;margin:12px 0 5px}.smallnote{font-size:.82rem;color:var(--muted)}.banner{border-radius:12px;padding:18px;background:var(--goldl);border:1px solid #ebd2a4}.copy-card summary{font-weight:750;cursor:pointer}.copy-card p{font-size:.89rem}.copy-foot{color:#7d4b1c;font-weight:700}.toast{position:fixed;right:20px;bottom:20px;background:#183c3c;color:white;padding:11px 18px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}.screen{min-height:100vh}.topfloat{position:sticky;top:0;background:rgba(244,245,242,.96);backdrop-filter:blur(9px);padding:9px 0;z-index:10}.source-list{display:grid;gap:14px}.source-card{border:1px solid var(--stroke);border-radius:11px;padding:20px;background:white;scroll-margin-top:20px}.source-card h3{margin-bottom:6px}.source-card a{word-break:break-word}.source-card .cat{font-size:.75rem;color:var(--teal);font-weight:800;text-transform:uppercase}.slideshell{background:#0e202a;min-height:100vh;padding:2.5vh 3vw;color:#fff;display:flex;flex-direction:column}.slidebar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#a9c8c5;font-size:.85rem}.slidecard{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1250px;width:100%;margin:2.5vh auto;background:linear-gradient(130deg,#143842,#1b3940);border:1px solid #42666a;border-radius:23px;padding:clamp(26px,5vw,82px);min-height:66vh}.slidecard h1{font:clamp(2rem,4vw,4.3rem)/1.15 Georgia,serif;color:#fff;max-width:1000px}.slidec @media(max-width:960px){.shell{display:block}.sidebar{position:relative;height:auto;padding:14px}.sidebar .brand{padding:0 8px}.navlist{display:flex;overflow:auto;gap:5px}.atelier-link{min-width:175px}.navtitle,.tools{display:none}.stage{padding:20px 14px 70px}.intent-grid,.activity-grid,.bilan-grid,.synthesis .theory,.toolgrid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.cover{padding:24px}}@media print{.sidebar,.toolbar,.steps-nav,.cover-actions,.endactivity,.promptbox button,.noscreen,.nextbar{display:none!important}.shell{display:block}.stage{padding:0}.workshop[hidden]{display:block!important}.cover{display:none}.activity,.intro,.synthesis{box-shadow:none;break-inside:avoid;border:1px solid #aaa}.bilan-inner{display:block!important}.synthesis{break-before:page}.slidecard{min-height:0}.slideshell{background:white;color:black}.slidecard{background:white;color:black;border:0}.slidecard h1,.slidecard p{color:black}}

</style></head><body><div class="slideshell"><div class="slidebar"><select id="pick" aria-label="Choisir le module" style="background:#143842;color:#e7f4ed;border:1px solid #42666a;border-radius:8px;padding:6px 8px"></select><span>Diaporama formateur · ← → pour naviguer · F plein écran</span><a id="back" href="index.html">Retour au parcours ↗</a></div><main class="slidecard" id="slide" aria-live="polite"><div class="eyebrow" id="label"></div><h1 id="slide-title"></h1><p id="slide-body"></p></main><div class="slide-controls"><button id="previous" type="button">← Précédente</button><span id="counter"></span><button id="next" type="button">Suivante →</button></div></div><script>const m={"O": [{"title": "Notre question : l’IA fait-elle davantage penser l’élève ?", "body": "Nous nous sommes mis momentanément à la place d’un élève sur une même tâche : problématiser « Peut-on vouloir la vérité à tout prix ? ». Trois prompts ont été testés dans des conversations neuves : réponse directe, aide guidée et questions sans solution."}, {"title": "Ce que les stagiaires ont réellement testé", "body": "Avant l’IA : un écrit personnel. Prompt 1 : une problématique et un plan. Prompt 2 : des étapes et indices successifs. Prompt 3 : une relance philosophique, une question à la fois. Après chaque essai : ce que j’ai produit moi-même et ce que l’IA a fourni."}, {"title": "Retour en posture d’enseignant : modifier, puis retester", "body": "Les collègues ont confronté leurs extraits, identifié un guidage trop directif ou trop vague, rédigé un prompt 4 et l’ont testé à nouveau. Ils ont ensuite proposé une version C de la séance, avec retrait de l’aide et tâche individuelle sans IA."}, {"title": "Repères théoriques pour interpréter, sans surconclure", "body": "Tozzi : problématiser, conceptualiser, argumenter. Dewey : l’enquête face à une difficulté. Chi et Wylie : qualité des activités cognitives. Soderstrom et Bjork : performance assistée n’est pas synonyme d’apprentissage durable. [TOZ] [DEW] [ICA] [PER]"}, {"title": "Trois questions avant d’adopter un prompt", "body": "1. Quelle opération de pensée attend-on de l’élève ? 2. Qu’a-t-il effectivement construit durant l’échange, avec quelle preuve ? 3. Comment saura-t-il réinvestir la démarche sur une tâche nouvelle sans IA ? Le prompt et la séance doivent être jugés ensemble."}, {"title": "Ce que nous pouvons conclure — et ce que nous ne pouvons pas", "body": "La simulation renseigne sur les types d’assistance et fait émerger des hypothèses professionnelles. Elle ne démontre pas un effet chez des lycéens : les stagiaires sont experts et les traces de classe sont fictives. Une véritable évaluation exigerait des productions autonomes d’élèves. [PER] [BO]"}], "M1": [{"title": "Notre question : comprendre Descartes ou recevoir son explication ?", "body": "Vous avez travaillé sur deux extraits authentiques, directement affichés. Question commune : Descartes prouve-t-il que toutes les opinions sont fausses ? Une réponse initiale sans IA sert de point de comparaison."}, {"title": "Expérience 1 : mon écrit avant / après la réponse directe", "body": "Vous avez rédigé votre première lecture, obtenu une explication de l’IA et vérifié dans le texte ses formulations. La comparaison porte sur la justification, pas sur la seule élégance du résultat."}, {"title": "Expérience 2 : trois médiations réellement vécues", "body": "Prompt 1 : corrigé direct. Prompt 2 : glossaire et segmentation. Prompt 3 : questions sur des expressions précises. Qu’avez-vous réellement dû chercher, expliquer et justifier dans chaque essai ?"}, {"title": "Expérience 3 : tester les limites du tuteur", "body": "Vous avez répondu comme un élève, introduit une erreur et demandé un corrigé. L’analyse des six tours distingue les opérations produites par vous et celles fournies par l’IA. Le prompt a ensuite été modifié et retesté."}, {"title": "Test de sortie : un nouveau passage sans IA", "body": "Sur le passage concernant les sens, chacun a dû citer une expression, expliquer une distinction et proposer une inférence. Ce transfert est une première trace d’autonomie, non une preuve définitive d’efficacité dans une classe réelle."}, {"title": "Repères pour décider comme professeur", "body": "Descartes : le doute méthodique ne démontre pas la fausseté de toute opinion. Chi : auto-explication ; Chi et Wylie : ICAP ; Sweller : charge cognitive ; Soderstrom et Bjork : performance immédiate versus apprentissage. Garder une aide uniquement si elle laisse un travail philosophique visible à l’élève. [DES] [EXP] [ICA] [SWE] [PER]"}], "M2": [{"title": "Notre problème : plan réussi ou problème construit ?", "body": "Vous avez rédigé une première réponse sans IA, puis essayé sur le même sujet trois modes d’aide : plan livré, guidage progressif, contradicteur. Le critère n’est pas la qualité apparente du plan mais la difficulté que vous avez appris à formuler."}, {"title": "Ce que l’immersion a rendu visible", "body": "Comparez une trace initiale, une sortie de modèle et une reformulation personnelle. Relevez le point où l’IA a fourni une transition ou, au contraire, demandé une raison et attendu réellement la réponse."}, {"title": "L’expérience du tuteur à l’épreuve", "body": "Le test « donne-moi le plan », le blocage et la réponse contradictoire vérifient le comportement réel d’un prétendu tuteur socratique. Une injonction générale « sois socratique » n’est pas une garantie."}, {"title": "Repères philosophiques et scientifiques", "body": "Tozzi décrit les exigences de problématisation, conceptualisation et argumentation. L’ICAP de Chi et Wylie distingue activité passive et construction active ; Kapur invite à étudier l’essai initial suivi d’une reprise structurante. La transposition à ce protocole de philosophie reste une hypothèse à tester. [TOZ] [ICA] [KAP]"}, {"title": "Que vaut une trace sans IA ?", "body": "Le dernier écrit sur « Faut-il toujours dire la vérité ? » est une tâche de transfert proche : argument, objection, réponse. Soderstrom et Bjork distinguent performance assistée et apprentissage durable. Une seule séance d’essai entre adultes ne démontre pas un effet chez les élèves. [PER]"}, {"title": "Décision pédagogique", "body": "Conservez un premier écrit sans IA ; testez une aide qui questionne vraiment ; faites réviser ; retirez l’aide sur une tâche proche et observez des traces. Si le prompt fait le problème à la place de l’élève, changez-le ou supprimez-le."}], "M3": [{"title": "Pourquoi vérifier une réponse séduisante ?", "body": "Vous avez testé une fausse attribution à Hannah Arendt, deux raisonnements fictifs fautifs et une controverse sur l’autonomie. Aucun accord entre plusieurs IA n’a valeur de preuve documentaire."}, {"title": "Leçon de l’enquête Arendt", "body": "Une phrase qui ressemble aux idées d’une autrice n’est pas nécessairement une citation authentique. Demander l’édition et la page ne suffit pas : il faut effectivement contrôler une source primaire ; sinon écrire « non vérifiée ». [ARE]"}, {"title": "Trois questions, trois jugements", "body": "1. Référence exacte ? 2. Inférence valide ? 3. Argument pertinent pour la question ? Ne laissez pas l’élégance du style ou la confiance du modèle fusionner ces contrôles."}, {"title": "Repère philosophique : autonomie", "body": "Kant lie la sortie de la minorité à l’usage de son propre entendement. Recevoir une aide et remettre à autrui la décision ne sont pas identiques. Il faut reconstruire l’argument au lieu de citer Kant comme argument d’autorité. [KAN]"}, {"title": "Le rôle du professeur", "body": "Faire conserver les réponses divergentes, remonter aux textes, distinguer une erreur prouvée d’une incertitude de vérification, faire formuler l’objection et le verdict par l’élève. [EDU] [UNE]"}, {"title": "Décision de sortie", "body": "Donnez aux élèves une phrase douteuse et un raisonnement : ils doivent justifier séparément la provenance, la validité et la pertinence, puis écrire leur jugement sans IA."}], "M4": [{"title": "Différencier : pour faire faire quoi ?", "body": "Vous avez travaillé la même question philosophique au moyen de trois aides : réponse fournie, aide lexicale et dialogue guidé. La difficulté d’accès peut varier, mais l’opération philosophique finale reste commune."}, {"title": "Ce que les tests permettent de comparer", "body": "Une paraphrase trop complète peut donner la distinction à la place de l’élève. Une aide graduée doit lui laisser retrouver un passage, expliciter une différence et la justifier."}, {"title": "Du commentaire agréable à la réécriture", "body": "Trois feedbacks ont été éprouvés sur la même copie fictive. Le bon indicateur n’est pas la gentillesse du commentaire, mais une révision faite par le stagiaire en position d’élève, puis examinée par un pair."}, {"title": "Repères de recherche", "body": "CAST propose des voies multiples d’accès et d’engagement sans réduire l’objectif. Hattie et Timperley décrivent les fonctions de la rétroaction ; Carless et Boud insistent sur l’appropriation active du feedback. Ces travaux ne valident pas automatiquement une sortie IA particulière. [UDL] [HAT] [CAR]"}, {"title": "Votre classeur : une épreuve de réalité", "body": "Un document personnel réutilisable — ou le support de secours — a été modifié et testé en binôme. Vérifier la fidélité d’une éventuelle lecture d’image par l’IA ; ne transmettre aucune donnée réelle d’élève. [CNIL] [MEN]"}, {"title": "Décision pédagogique", "body": "Nommer l’obstacle d’accès, annoncer un objectif invariant, faire faire la tâche à un collègue en posture d’élève, conserver un test sans IA et un plan B hors ligne."}], "M5": [{"title": "Le problème : corriger, puis faire apprendre", "body": "Deux extraits de dissertations fictives condensées ont d’abord été examinés sans IA. Trois prompts ont produit des retours divergents : ils ont ensuite été confrontés aux passages exacts et au jugement global humain."}, {"title": "Le cadre de l’évaluation", "body": "Les attendus institutionnels éclairent une appréciation globale de la dissertation. Le corpus condensé n’autorise aucune prétention à attribuer une note officielle à une copie complète ; la correction IA ne vaut pas jury. [BOA] [BO]"}, {"title": "La confrontation est un travail de justification", "body": "La copie A peut sembler fluide tout en restant philosophiquement fragile ; une autre production peut chercher un problème réel mais demeurer inaboutie. Le groupe argumente, cite les traces et assume les incertitudes."}, {"title": "Douze traces : quelles décisions de cours ?", "body": "Les stagiaires ont regroupé P01–P12 d’abord sans IA, puis avec deux propositions de catégories. Ils en ont tiré une reprise collective, des groupes temporaires et une tâche finale commune plutôt qu’une classification figée des élèves."}, {"title": "Chaque élève doit pouvoir utiliser son retour", "body": "Pour trois profils fictifs, tester le feedback en faisant soi-même la tâche de reprise : peut-on agir à partir du commentaire reçu ? Sadler, Hattie et Timperley, Carless et Boud éclairent le lien entre critères, appropriation et actions après correction. [SAD] [HAT] [CAR]"}, {"title": "Décision professionnelle", "body": "Conserver la main sur le jugement, travailler uniquement sur des exemples fictifs ou selon un cadre autorisé, choisir une priorité de réenseignement et recueillir de nouvelles preuves sans IA. [CNIL] [MEN]"}], "M6": [{"title": "Une séance ne commence pas par un prompt", "body": "Chaque stagiaire est parti de son propre support réutilisable ou du cas de secours. Il a formulé une difficulté observable puis réalisé lui-même la tâche avant toute IA."}, {"title": "Trois tests avant de choisir", "body": "Une réponse intégrale a été comparée à une médiation avec retrait. Un troisième prompt a ensuite joué le pair critique : erreur possible, objectif non vérifié, document absent, confidentialité."}, {"title": "L’épreuve du binôme", "body": "Le collègue a joué l’élève et effectué la tâche finale sans IA. Sa trace permet de détecter les consignes implicites et l’aide qui fait à la place : elle ne constitue pas une validation statistique du dispositif."}, {"title": "Repères théoriques", "body": "Problématiser, conceptualiser et argumenter structurent le travail disciplinaire (Tozzi). La distinction performance / apprentissage (Soderstrom et Bjork) et les principes d’accessibilité (CAST) aident à concevoir des preuves et plusieurs voies d’accès. [TOZ] [PER] [UDL]"}, {"title": "Quelles précautions de mise en œuvre ?", "body": "Un objectif invariant, un support vérifié, aucun envoi de données réelles d’élèves à un service grand public, une variante sans IA et une décision pédagogique justifiée. [MEN] [CNIL]"}, {"title": "Votre engagement vérifiable", "body": "Énoncer : besoin d’élève, choix d’une médiation, résultat du test entre pairs, risque restant, trace attendue lors d’un essai limité en classe. Prévoir ce qui vous ferait réviser ou retirer l’IA."}, {"title": "La charte de classe", "body": "Ce que l’IA peut faire pour toi, ce qu’elle ne fait pas à ta place, ce que tu déclares, ce que tu vérifies, tes données, ce que fait ton professeur."}], "N1": [{"title": "Deux copies, un vote", "body": "Une introduction maladroite qui pose un vrai problème, une introduction fluide qui répète le sujet. Laquelle vient de l’IA ? Laquelle mérite la meilleure note ?"}, {"title": "Ce que fait la copie X", "body": "Elle part d’une évidence, la confronte à un cas qui résiste et formule une tension : vouloir la vérité « pour nous ou contre nous ». C’est un début de problématisation."}, {"title": "Ce que fait la copie Y", "body": "Autorité décorative, sujet reformulé en question, plan thèse / limites / synthèse : toutes les apparences du travail attendu, sans difficulté examinée."}, {"title": "Le danger pour la classe", "body": "Si nos critères récompensent d’abord la fluidité, déléguer à l’IA devient rationnel pour l’élève. [TOZ] [BO]"}, {"title": "Trois questions pour tout le parcours", "body": "Quelle opération philosophique reste à l’élève ? Quelle trace la montre ? Que sait-il faire ensuite seul ?"}, {"title": "Où en sommes-nous ?", "body": "Photo de la ligne du débat mouvant et positionnement individuel : on les refera au module 9."}], "N2": [{"title": "Pourquoi vérifier ? Parce qu’on sait comment ça marche", "body": "Un modèle de langage prolonge un texte avec la suite la plus plausible. Plausible ne veut pas dire vrai. [BEN]"}, {"title": "Il ne consulte pas de bibliothèque", "body": "Sauf recherche explicite, une référence peut être fabriquée parce qu’elle ressemble aux références habituelles. [HAL]"}, {"title": "Il cherche à plaire", "body": "Il change d’avis sous la pression et félicite un texte faible si on lui dit en être fier : c’est la complaisance. [SYC]"}, {"title": "Il varie", "body": "La même question donne des réponses différentes. Deux IA d’accord ne font pas une preuve."}, {"title": "Ce que nos démonstrations ont montré", "body": "Variabilité, invention de citations, complaisance, désaccord : quatre raisons de ne jamais citer une IA comme une source."}, {"title": "Conséquence didactique", "body": "Vérifier devient une compétence enseignée : demander la source, la chercher, comparer, conclure « vérifié / faux / non vérifiable ». [MEN]"}], "N3": [{"title": "Six risques, pas un seul", "body": "Délégation, illusion de compréhension, faux soupçon, dépendance affective, données personnelles, uniformisation et inégalités."}, {"title": "Le risque majeur", "body": "Ce n’est pas que l’élève triche : c’est qu’il cesse de penser en croyant apprendre. Les premières études vont dans ce sens, avec prudence. [GER]"}, {"title": "Les détecteurs ne prouvent rien", "body": "Peu fiables, ils pénalisent davantage les élèves qui écrivent dans une langue seconde. Jamais de sanction sur un score. [DET]"}, {"title": "Des copies qui se ressemblent", "body": "Les productions assistées sont plus homogènes entre elles : la singularité de la pensée est en jeu. [DIV]"}, {"title": "Protéger", "body": "Aucune donnée personnelle dans un service grand public ; orienter l’élève isolé vers les adultes ressources ; ne jamais rendre l’outil nécessaire à la réussite. [CNIL] [MEN]"}, {"title": "Concevoir plutôt que détecter", "body": "Traces de travail, écrit en classe, oral de soutenance, déclaration d’usage : rendre la délégation inutile."}], "N6": [{"title": "Préparer ses cours : où l’IA fait gagner du temps", "body": "Exemples et contre-exemples ciblés, variantes d’exercices, reformulations de consignes."}, {"title": "La précision du prompt change tout", "body": "Une demande ciblée sur une distinction et un public donne une matière utilisable ; une demande vague donne du plat."}, {"title": "Le tri ne se délègue pas", "body": "Faux, plat, utilisable : seul le professeur qui maîtrise la distinction peut trier."}, {"title": "Ce qu’on ne demande jamais", "body": "Le texte d’un auteur, une citation ou une référence sans vérification dans une édition. [EDU]"}, {"title": "Le vrai temps", "body": "Le gain se compte vérification comprise. Si vérifier prend plus de temps qu’écrire, l’outil n’est pas utile pour cette tâche."}, {"title": "Garder sa voix", "body": "Une ressource générée et distribuée telle quelle a la voix de personne. Réécrire, c’est la rendre enseignable. [MEN] [CNIL]"}], "N8": [{"title": "Une machine qui parle pense-t-elle ?", "body": "La philosophie dispose de concepts pour penser ce que nous avons vécu pendant la formation."}, {"title": "Platon : le remède et le poison", "body": "Dans le Phèdre, l’écriture promise comme remède à la mémoire produirait l’oubli et une apparence de savoir. [PLA]"}, {"title": "Descartes : le langage comme signe de la pensée", "body": "Une machine ne saurait arranger ses paroles pour répondre au sens de tout ce qu’on lui dit. Ce critère tient-il encore ? [DSD]"}, {"title": "Turing et Searle", "body": "Turing remplace la question par un test d’imitation ; Searle répond que manipuler des symboles n’est pas comprendre. [TUR] [SEA]"}, {"title": "Une pharmacologie de la technique", "body": "Chaque technique peut soigner ou empoisonner selon l’usage : c’est le discernement que la formation a exercé. [STI]"}, {"title": "En classe", "body": "L’IA comme objet de cours : la technique, le langage, la conscience, la vérité, le travail. Toujours un texte, toujours un écrit personnel."}]};const T={"N1": "Module 1 · Deux copies", "N2": "Module 2 · Comprendre la machine", "N3": "Module 3 · Les risques pour l’élève", "O": "Module 4A · Trois usages face à un sujet", "M1": "Module 4B · Lire un texte avec l’IA", "M2": "Module 4C · Faire naître un problème", "M3": "Module 5 · Vérifier, enquêter", "N6": "Module 6 · Préparer ses cours", "M4": "Module 7A · Adapter l’accès, donner un feedback", "M5": "Module 7B · Corriger pour faire apprendre", "N8": "Module 8 · Penser l’IA en philosophe", "M6": "Module 9 · Charte et séance réelle"};const ORDER=["N1", "N2", "N3", "O", "M1", "M2", "M3", "N6", "M4", "M5", "N8", "M6"];
(()=>{const q=new URLSearchParams(location.search);let k=q.get('atelier');if(!m[k])k=ORDER[0];let i=Math.max(0,Math.min((+q.get('s')||1)-1,m[k].length-1));
const $=id=>document.getElementById(id);const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pick=$('pick');ORDER.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=T[x];if(x===k)o.selected=true;pick.append(o)});
pick.addEventListener('change',()=>{k=pick.value;i=0;render()});
function render(){const sl=m[k][i];$('label').textContent=T[k]+' · bilan';$('slide-title').textContent=sl.title;
$('slide-body').innerHTML=esc(sl.body).replace(/\[([A-Z]{2,5})\]/g,'<a class="cite" href="sources.html#src-$1" target="_blank" rel="noopener">$1</a>');
$('counter').textContent=(i+1)+' / '+m[k].length;$('previous').disabled=i===0;$('next').textContent=i===m[k].length-1?'Module suivant →':'Suivante →';
$('back').href='index.html#atelier-'+k;document.title=T[k]+' — Diaporama';history.replaceState(null,'','?atelier='+k+'&s='+(i+1))}
function go(d){i+=d;if(i>=m[k].length){const n=ORDER[ORDER.indexOf(k)+1];if(n){k=n;i=0;pick.value=k}else i=m[k].length-1}if(i<0)i=0;render()}
$('previous').onclick=()=>go(-1);$('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target===pick)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}else if(e.key==='Home'){i=0;render()}else if(e.key==='End'){i=m[k].length-1;render()}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});
render()})();</script></body></html>
