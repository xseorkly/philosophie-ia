*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--teal)}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #d3943c;outline-offset:3px}h1,h2,h3,h4,p{margin-top:0}h1,h2,.serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.02em}h1{font-size:clamp(2.1rem,4vw,4rem);line-height:1.1}h2{font-size:clamp(1.7rem,2.7vw,2.6rem);line-height:1.2}h3{font-size:1.34rem}p{max-width:78ch}.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:850;color:var(--teal)}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{background:#122d36;color:#e6eff1;padding:28px 17px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}.sidebar .brand{padding:0 12px 20px}.brand strong{display:block;font:1.42rem Georgia,serif;letter-spacing:-.02em}.brand p{color:#b5c9c9;font-size:.82rem;margin:.65rem 0 0}.navtitle{margin:18px 12px 9px;font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:#a5c9be;font-weight:750}.atelier-link{display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;color:#d8e4e5;text-align:left;background:none;border:0;width:100%;line-height:1.23}.atelier-link:hover,.atelier-link.active{background:#24505a;color:white}.atelier-link .num{display:grid;place-items:center;min-width:29px;height:29px;border:1px solid #4f777d;border-radius:8px;color:#afdbd1;font-size:.75rem}.atelier-link b{font-weight:650;font-size:.9rem}.atelier-link small{display:block;color:#b6cbd0;font-size:.74rem;margin-top:5px}.tools{margin-top:auto;border-top:1px solid #34525d;padding:18px 10px}.tools button,.tools label{font-size:.79rem;display:block;width:100%;border:1px solid #5a7d84;color:white;background:transparent;padding:9px;border-radius:9px;text-align:left;margin:6px 0}.tools label input{width:100%;margin-top:5px;color:white;font-size:.75rem}.tools p{color:#aec4c7;font-size:.73rem}.stage{width:100%;padding:26px min(4vw,70px) 90px;max-width:1540px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--stroke);padding:0 0 17px;margin:0 0 24px}.toolbar a{text-decoration:none;font-size:.84rem;font-weight:700}.pill{border:1px solid var(--stroke);border-radius:999px;background:var(--paper);font-size:.75rem;color:var(--muted);padding:5px 10px}.workshop[hidden],.screen[hidden]{display:none!important}.cover,.intro,.panel,.activity,.synthesis,.resourcebox{background:var(--paper);border:1px solid var(--stroke);border-radius:18px;box-shadow:var(--shadow)}.cover{padding:clamp(23px,5vw,65px);background:linear-gradient(110deg,#fff 55%,#e8f4f0)}.cover .lead{font-size:1.15rem;max-width:58ch}.cover-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{background:var(--teal);color:white;border:1px solid var(--teal);border-radius:10px;padding:11px 17px;font-weight:750;display:inline-flex;align-items:center;gap:8px;text-decoration:none}.btn:hover{background:#0b4e4a}.btn.secondary{background:#fff;color:var(--teal);border-color:#9dc6bb}.btn.ghost{background:transparent;border:1px solid var(--stroke);color:var(--ink)}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px}.tile{border:1px solid var(--stroke);border-radius:13px;padding:21px;background:#fff;text-align:left;box-shadow:var(--shadow)}.tile:hover{border-color:#78afa4;transform:translateY(-1px)}.tile span{font-size:.75rem;color:var(--teal);font-weight:800}.tile h3{font-family:Georgia,serif;margin:9px 0 8px}.tile p{font-size:.89rem;color:var(--muted);margin:0}.intro{padding:clamp(22px,4vw,48px)}.intro h1{font-size:clamp(2rem,3.4vw,3.5rem);max-width:850px}.intro .problem{background:var(--teall);padding:17px x(0,1fr));gap:13px}.toolgrid article{border:1px solid var(--stroke);border-radius:10px;padding:15px;background:#fff}.prompthead{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.79rem;font-weight:750}.correction-kit{padding:16px;background:white;border:1px solid var(--stroke);border-radius:10px;margin-top:14px}.correction-kit h3{margin:12px 0}.write{margin-top:19px}.write label{font-weight:800;font-size:.85rem;display:block;margin-bottom:8px}.write textarea,.matrix textarea{display:block;width:100%;resize:vertical;min-height:112px;border:1px solid #bbcaca;border-radius:9px;padding:12px;background:#fff}.write small{color:var(--muted);font-size:.72rem}.bilan{margin-top:16px;border:1px solid #dccbb3;background:#fffbf4;border-radius:9px}.bilan summary{list-style:none;padding:13px 15px;cursor:pointer;font-weight:750;font-size:.87rem}.bilan-inner{padding:0 17px 16px}.bilan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.bilan-cell{padding:13px;border-radius:8px;background:white;border:1px solid #eee0c7}.bilan-cell h5{font-size:.8rem;color:#794a1d;text-transform:uppercase;margin:0 0 6px}.bilan-cell p{font-size:.85rem;margin:0}.sourcesused{font-size:.78rem;margin:12px 0 0}.ref-pill,.cite{display:inline-block;background:#dceee8;border:1px solid #b8d6ce;color:#155c56;border-radius:5px;padding:0 5px;margin:0 2px;text-decoration:none;font-weight:750;font-size:.78rem}.endactivity{display:flex;justify-content:space-between;margin-top:15px;font-size:.83rem}.done{display:flex;gap:8px;align-items:center}.resourcebox{padding:20px;margin:20px 0}.resourcebox summary{cursor:pointer;font-weight:750}.resourcebox .copy-card{margin-top:12px;padding:11px;border:1px solid var(--stroke);border-radius:8px}.resourcebox p{max-width:none}.synthesis{padding:clamp(24px,4vw,46px);margin-top:29px;background:linear-gradient(145deg,#f8fdfb,#fff)}.synthesis h2{max-width:900px}.synthesis .theory{display:grid;grid-template-columns:repeat(2,minmax(0, </style></head><body><div class="slideshell"><div class="slidebar"><select id="pick" aria-label="Choisir le module" style="background:#143842;color:#e7f4ed;border:1px solid #42666a;border-radius:8px;padding:6px 8px"></select><span>Diaporama formateur · ← → pour naviguer · F plein écran</span><a id="back" href="index.html">Retour au parcours ↗</a></div><main class="slidecard" id="slide" aria-live="polite"><div class="eyebrow" id="label"></div><h1 id="slide-title"></h1><p id="slide-body"></p></main><div class="slide-controls"><button id="previous" type="button">← Précédente</button><span id="counter"></span><button id="next" type="button">Suivante →</button></div></div><script>const m={"N1": [{"title": "Question directrice", "body": "Une copie fluide n’est pas une pensée. La première décision du professeur n’est pas technique : elle porte sur ce qu’il valorise quand il corrige."}, {"title": "Le fil rouge", "body": "Inès, élève fictive de Terminale, revient aux modules 1, 3, 4 et 5 : sa copie, sa semaine de délégation, son illusion d’avoir compris Kant, son dialogue avec un tuteur. Elle sert à garder sous les yeux un élève concret."}, {"title": "Ce qu’on gardera", "body": "Trois questions pour juger tout usage : quelle opération philosophique reste à l’élève ? Quelle trace la montre ? Que sait-il faire ensuite seul ?"}, {"title": "Pour la suite", "body": "Pour juger ce que fait l’IA, il faut d’abord comprendre comment elle produit ses réponses : c’est l’objet du module 2. [TOZ] [BO]"}], "N2": [{"title": "Ce que fait un modèle de langage", "body": "Il calcule la suite probable d’un texte à partir de régularités apprises sur d’immenses corpus. Bender et ses collègues insistent sur ce point : produire une langue fluide n’implique ni compréhension ni accès à la vérité."}, {"title": "Plausible n’est pas vrai", "body": "Les travaux sur les « hallucinations » (on dira plutôt : affirmations fausses produites avec assurance) montrent que ce phénomène est général, réduit mais non supprimé par les versions récentes. Le module 7 en fait une enquête."}, {"title": "La complaisance", "body": "Sharma et ses collègues montrent que des assistants entraînés sur les préférences humaines tendent à aller dans le sens de l’utilisateur, y compris contre l’exactitude."}, {"title": "Conséquence didactique", "body": "L’esprit critique sur l’IA devient un savoir : on vérifie parce qu’on sait pourquoi l’outil se trompe. Le module 7 en fera une méthode d’enquête. [BEN] [HAL] [SYC] [MEN]"}], "N4": [{"title": "Question directrice", "body": "Déléguer n’est ni un vice ni une fatalité : c’est un choix rationnel à court terme, dans une situation où l’effort coûte, où la réussite paraît hors de portée et où le produit est seul évalué."}, {"title": "Trois familles de mécanismes", "body": "Économiques : l’effort mental est un coût mis en balance avec la valeur attendue. Métacognitives : la fluidité donne l’illusion de savoir, et le délestage dépend de la confiance en soi. Motivationnelles : compétence, autonomie et peur de l’évaluation commandent l’engagement."}, {"title": "Ce que montrent les études récentes", "body": "Les essais contrôlés convergent : l’aide libre améliore la performance assistée sans améliorer, voire en dégradant, l’apprentissage mesuré sans aide. Un outil conçu pour faire travailler l’élève limite la perte, et peut même produire un gain (Kestin et al.)."}, {"title": "Conséquence pour le professeur", "body": "Agir sur la conception des tâches (jalons, génération, rappel différé, preuve sans aide) et sur le rapport de l’élève à sa propre pensée, bien plus que sur la surveillance. [KOO] [SHE] [RIS] [FLU] [GEN] [BAST] [FAN] [KOS] [SDT]"}], "N3": [{"title": "Question directrice", "body": "Le danger majeur n’est pas que l’élève triche, c’est qu’il cesse de penser en croyant apprendre. La triche n’en est qu’un cas visible."}, {"title": "Ce que dit la recherche", "body": "Les premières études associent un usage intensif de l’IA à un moindre engagement critique ; d’autres montrent que les productions assistées sont plus homogènes entre elles. Ces résultats sont récents et appellent la prudence."}, {"title": "Détecter ou concevoir", "body": "Les détecteurs sont trop peu fiables pour fonder une décision. La réponse est pédagogique : traces de travail, écrit en classe, oral de soutenance, déclaration d’usage."}, {"title": "Protéger", "body": "Données personnelles, élèves fragiles, inégalités d’accès : ces risques relèvent aussi du cadre de l’établissement et du travail avec la vie scolaire. [GER] [DET] [DIV] [CNIL] [MEN]"}], "N5": [{"title": "Question directrice", "body": "Une aide n’est didactique que si elle laisse à l’élève la responsabilité du problème et si elle se retire. L’IA tend spontanément à faire l’inverse."}, {"title": "Concepts", "body": "Contrat didactique, effet Topaze et dévolution (Brousseau) ; fonctions de l’étayage (Wood, Bruner, Ross) ; zone proximale de développement (Vygotski) ; malentendus sociocognitifs (Bautier et Rayou)."}, {"title": "Répartition des rôles", "body": "L’outil peut démontrer, découper, relancer. Le professeur garde le diagnostic, la dévolution, le retrait de l’aide et le moment où l’on dit ce qu’il fallait retenir."}, {"title": "Nos exercices", "body": "L’IA oblige à expliciter ce que nos exercices font apprendre et à évaluer davantage le processus de pensée que son seul produit. [BRO] [WBR] [VYG] [BAU] [KAN] [TOZ]"}], "O": [{"title": "Question directrice", "body": "Une aide fait mieux philosopher si elle laisse à l’élève l’épreuve de la tension. Sinon elle améliore le texte et prive l’élève de l’activité qui l’aurait fait apprendre."}, {"title": "Sciences cognitives", "body": "On retient ce qu’on a produit ; l’impression de comprendre n’est pas une preuve ; une aide se juge à ce qu’elle laisse à faire."}, {"title": "Didactique", "body": "Laisser le problème à l’élève (dévolution), calibrer l’aide sur sa première trace, l’arrêter sur un indice observable, rompre le contrat « l’aide donne la réponse »."}, {"title": "Philosophie", "body": "Tozzi décrit la problématisation comme un processus ; Dewey fait naître la pensée d’une perplexité ; Bachelard la fait naître contre une évidence. Une aide qui supprime la perplexité supprime la pensée."}, {"title": "Décision", "body": "Définir l’apprentissage, choisir l’aide, la faire tester par un collègue qui veut le plan, prévoir son arrêt et la preuve sans aide. Ne pas utiliser l’IA reste une réponse recevable. [TOZ] [DEW] [BAC] [KAP] [SYC] [GEN] [KAL] [BRO]"}], "M1": [{"title": "Question directrice", "body": "Expliquer un texte, c’est en éprouver la résistance. Une explication fluide peut supprimer l’objet même de l’exercice."}, {"title": "Sciences cognitives", "body": "Illusion de compréhension par la fluidité, illusion de profondeur explicative, auto-explication, charge intrinsèque : quatre raisons de faire expliquer l’élève plutôt que de lui expliquer."}, {"title": "Didactique", "body": "L’obstacle de R2 est conceptuel. Il ne se lève pas par une explication correcte mais par une confrontation de l’élève à une expression précise du texte."}, {"title": "Transfert", "body": "Le nouveau passage prouve un transfert proche ; un transfert lointain et une reprise différée sont nécessaires pour parler d’acquisition."}, {"title": "Décision", "body": "Lever le lexique, préserver l’inférence, faire expliquer avant de vérifier, prévoir la lecture d’un nouveau passage sans aide. [DES] [FLU] [IOED] [EXP] [SWE] [GIC]"}], "M3": [{"title": "Question directrice", "body": "Que vaut un témoignage sans témoin ? Une réponse d’IA n’a ni auteur responsable, ni intention, ni source identifiable."}, {"title": "Sciences cognitives", "body": "Vigilance épistémique, effet de vérité par la fluidité, biais d’automatisation : nos mécanismes de confiance sont mal ajustés à un interlocuteur sans source et toujours assuré."}, {"title": "Trois verdicts distincts", "body": "Provenance, validité de l’inférence, pertinence pour le problème : trois compétences à travailler séparément."}, {"title": "Philosophie", "body": "Distinguer ce qu’écrit Arendt de ce qu’on lui fait dire  ; arbitrer entre deux lectures de Rousseau à partir du texte ; distinguer une citation exacte, déformée ou mal référencée."}, {"title": "Institutionnalisation", "body": "L’IA est un texte à examiner, non un arbitre. « Non vérifié » est une conclusion légitime ; l’indépendance des sources est un critère. [SPE] [FLU] [AUT] [HAL] [ARE]"}], "N6": [{"title": "Question directrice", "body": "L’IA peut alléger la préparation sur les tâches où le professeur reconnaît vite l’erreur. Le gain se compte sélection et vérification comprises."}, {"title": "Didactique", "body": "Un exemple généré n’est pas transposé : il faut le choisir et l’ordonner pour qu’il serve un problème. La variation des cas fait abstraire la distinction."}, {"title": "Sciences cognitives", "body": "Le biais d’automatisation touche aussi le professeur ; le délestage de la préparation peut appauvrir sa propre compréhension de la notion."}, {"title": "Cadre", "body": "Usage professionnel admis sous réserve de vérification ; textes pris dans des éditions ; aucune donnée d’élève. [CHE] [GIC] [AUT] [RIS] [MEN]"}], "M4": [{"title": "Question directrice", "body": "Différencier, ce n’est pas attribuer trois exercices de valeur différente : c’est varier l’accès en conservant l’objet intellectuel."}, {"title": "Charge cognitive", "body": "Réduire la charge extrinsèque est légitime ; réduire la charge intrinsèque supprime l’apprentissage. Ce qui aide un novice peut gêner un élève avancé."}, {"title": "Accessibilité", "body": "Plusieurs voies d’accès, une même exigence, des aides activables et retirables, un plan B sans IA."}, {"title": "Institutionnalisation", "body": "Chaque support conduit à une nouvelle production autonome sur le même critère exigeant ; pas d’étiquettes médicales ni de profils figés. [SWE] [KAL] [UDL]"}], "M5": [{"title": "Question directrice", "body": "Le dialogue entre correcteur et IA ne sert pas à produire une note moyenne : il aide à justifier un jugement et à préparer les apprentissages suivants."}, {"title": "Docimologie", "body": "La note est un jugement fragile ; les écarts entre correcteurs sont structurels. L’IA ajoute un jugement à discuter, non une mesure."}, {"title": "Biais", "body": "Ancrage et biais d’automatisation imposent un ordre : juger d’abord, confronter ensuite, justifier chaque remarque retenue par un passage de la copie."}, {"title": "Cadre officiel 2027", "body": "Évaluation globale de la démarche ; pas de micro-barème à inventer."}, {"title": "Retour et reprise", "body": "Un obstacle prioritaire, une action, une réécriture, une observation différée : sans tâche de reprise, le meilleur retour reste sans effet. [PIE] [MER] [ANC] [AUT] [BO] [CAR]"}], "N7": [{"title": "Question directrice", "body": "L’enjeu n’est pas de contrôler un usage, mais de former un rapport : celui de l’élève à sa propre pensée, et à un outil qu’il utilisera toute sa vie."}, {"title": "Instituer", "body": "Une séance de rentrée qui fait de l’IA un problème philosophique, puis une charte co-construite, avec des niveaux d’usage par exercice et une déclaration."}, {"title": "Accompagner", "body": "Une progression qui va de l’encadrement à l’autonomie, des rituels courts qui rendent la pensée visible, des évaluations sans outil qui disent ce que l’élève sait faire."}, {"title": "Protéger", "body": "Entretien plutôt que détecteur, attention aux élèves fragiles et allophones, lien avec les familles, l’équipe et la vie scolaire. [AIAS] [RET] [GEN] [DET] [SDT] [PLA] [MEN] [CNIL]"}], "N8": [{"title": "Question directrice", "body": "La philosophie n’a pas attendu l’IA pour penser les machines, le langage et les techniques de la pensée : elle offre à la classe les concepts pour juger ce que les élèves vivent."}, {"title": "Le fil des textes", "body": "Platon pense la technique comme remède et poison ; Descartes fait du langage le signe de la pensée ; Turing propose un test observable ; Searle sépare manipulation de symboles et compréhension."}, {"title": "Une pharmacologie (pour aller plus loin)", "body": "Stiegler invite à penser chaque technique comme ce qui peut soigner ou empoisonner selon l’usage : c’est exactement le travail de discernement que la formation a mené."}, {"title": "En classe", "body": "L’IA devient un objet de cours qui croise plusieurs notions et qui motive les élèves, à condition de toujours revenir aux textes et à un écrit personnel. [PLA] [DSD] [TUR] [SEA] [STI]"}], "M6": [{"title": "Question directrice", "body": "Une séance avec IA est une hypothèse didactique : si l’élève fait ceci avec cette aide, il saura ensuite faire cela seul. Elle se conçoit, se teste et se révise comme telle."}, {"title": "Concevoir", "body": "La matrice articule l’obstacle et son origine supposée, le mécanisme cognitif visé, le concept didactique, l’aide et son retrait, la preuve sans aide et différée, ce qui fausserait la conclusion et le critère d’abandon."}, {"title": "Tester", "body": "Le test entre pairs déjoue l’implicite du concepteur ; l’audit par l’IA fournit des hypothèses à vérifier, jamais un verdict."}, {"title": "Itérer", "body": "La recherche orientée par la conception procède par cycles courts : une version, une trace, une révision. Une recherche-action modeste vaut mieux qu’une promesse d’efficacité."}, {"title": "S’engager", "body": "Des intentions de mise en œuvre datées et une trace prévue : c’est l’effet observé chez vos élèves qui fera durer, ou réviser, ce que vous avez appris ici. [DBR] [CUR] [AUT] [GOL] [GUS] [PER]"}]};const T={"N1": "Module 1 · Deux copies", "N2": "Module 2 · Comprendre la machine", "N4": "Module 3 · Pourquoi l’élève délègue", "N3": "Module 4 · Les risques pour l’élève", "N5": "Module 5 · Didactique de l’étayage", "O": "Module 6A · Aider à problématiser", "M1": "Module 6B · Lire un texte avec l’IA", "M3": "Module 7 · Vérifier, enquêter", "N6": "Module 8 · Préparer ses cours", "M4": "Module 9A · Différencier sans dénaturer", "M5": "Module 9B · Corriger et faire un retour", "N7": "Module 10 · Accompagner toute l’année", "N8": "Module 11 · Penser l’IA en philosophe", "M6": "Module 12 · Séance réelle et engagement"};const ORDER=["N1", "N2", "N4", "N3", "N5", "O", "M1", "M3", "N6", "M4", "M5", "N7", "N8", "M6"];
(()=>{const q=new URLSearchParams(location.search);let k=q.get('atelier');if(!m[k])k=ORDER[0];let i=Math.max(0,Math.min((+q.get('s')||1)-1,m[k].length-1));
const $=id=>document.getElementById(id);const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pick=$('pick');ORDER.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=T[x];if(x===k)o.selected=true;pick.append(o)});
pick.addEventListener('change',()=>{k=pick.value;i=0;render()});
function render(){const sl=m[k][i];$('label').textContent=T[k]+' · bilan';$('slide-title').textContent=sl.title;
$('slide-body').innerHTML=esc(sl.body).replace(/\[([A-Z]{2,5})\]/g,'<a class="cite" href="sources.html#src-$1" target="_blank" rel="noopener">$1</a>');
$('counter').textContent=(i+1)+' / '+m[k].length;$('previous').disabled=i===0;$('next').textContent=i===m[k].length-1?'Module suivant →':'Suivante →';
$('back').href='index.html#atelier-'+k;document.title=T[k]+' — Diaporama';history.replaceState(null,'','?atelier='+k+'&s='+(i+1))}
function go(d){i+=d;if(i>=m[k].length){const n=ORDER[ORDER.indexOf(k)+1];if(n){k=n;i=0;pick.value=k}else i=m[k].length-1}if(i<0)i=0;render()}
$('previous').onclick=()=>go(-1);$('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target===pick)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}else if(e.key==='Home'){i=0;render()}else if(e.key==='End'){i=m[k].length-1;render()}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});
render()})();</script></body></html>
