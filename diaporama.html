<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diaporama de bilan — Philosophie × IA</title><style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--teal)}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #d3943c;outline-offset:3px}h1,h2,h3,h4,p{margin-top:0}h1,h2,.serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.02em}h1{font-size:clamp(2.1rem,4vw,4rem);line-height:1.1}h2{font-size:clamp(1.7rem,2.7vw,2.6rem);line-height:1.2}h3{font-size:1.34rem}p{max-width:78ch}.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:850;color:var(--teal)}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{background:#122d36;color:#e6eff1;padding:28px 17px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}.sidebar .brand{padding:0 12px 20px}.brand strong{display:block;font:1.42rem Georgia,serif;letter-spacing:-.02em}.brand p{color:#b5c9c9;font-size:.82rem;margin:.65rem 0 0}.navtitle{margin:18px 12px 9px;font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:#a5c9be;font-weight:750}.atelier-link{display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;color:#d8e4e5;text-align:left;background:none;border:0;width:100%;line-height:1.23}.atelier-link:hover,.atelier-link.active{background:#24505a;color:white}.atelier-link .num{display:grid;place-items:center;min-width:29px;height:29px;border:1px solid #4f777d;border-radius:8px;color:#afdbd1;font-size:.75rem}.atelier-link b{font-weight:650;font-size:.9rem}.atelier-link small{display:block;color:#b6cbd0;font-size:.74rem;margin-top:5px}.tools{margin-top:auto;border-top:1px solid #34525d;padding:18px 10px}.tools button,.tools label{font-size:.79rem;display:block;width:100%;border:1px solid #5a7d84;color:white;background:transparent;padding:9px;border-radius:9px;text-align:left;margin:6px 0}.tools label input{width:100%;margin-top:5px;color:white;font-size:.75rem}.tools p{color:#aec4c7;font-size:.73rem}.stage{width:100%;padding:26px min(4vw,70px) 90px;max-width:1540px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--stroke);padding:0 0 17px;margin:0 0 24px}.toolbar a{text-decoration:none;font-size:.84rem;font-weight:700}.pill{border:1px solid var(--stroke);border-radius:999px;background:var(--paper);font-size:.75rem;color:var(--muted);padding:5px 10px}.workshop[hidden],.screen[hidden]{display:none!important}.cover,.intro,.panel,.activity,.synthesis,.resourcebox{background:var(--paper);border:1px solid var(--stroke);border-radius:18px;box-shadow:var(--shadow)}.cover{padding:clamp(23px,5vw,65px);background:linear-gradient(110deg,#fff 55%,#e8f4f0)}.cover .lead{font-size:1.15rem;max-width:58ch}.cover-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{background:var(--teal);color:white;border:1px solid var(--teal);border-radius:10px;padding:11px 17px;font-weight:750;display:inline-flex;align-items:center;gap:8px;text-decoration:none}.btn:hover{background:#0b4e4a}.btn.secondary{background:#fff;color:var(--teal);border-color:#9dc6bb}.btn.ghost{background:transparent;border:1px solid var(--stroke);color:var(--ink)}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px}.tile{border:1px solid var(--stroke);border-radius:13px;padding:21px;background:#fff;text-align:left;box-shadow:var(--shadow)}.tile:hover{border-color:#78afa4;transform:translateY(-1px)}.tile span{font-size:.75rem;color:var(--teal);font-weight:800}.tile h3{font-family:Georgia,serif;margin:9px 0 8px}.tile p{font-size:.89rem;color:var(--muted);margin:0}.intro{padding:clamp(22px,4vw,48px)}.intro h1{font-size:clamp(2rem,3.4vw,3.5rem);max-width:850px}.intro .problem{background:var(--teall);padding:17px 20px;border-left:4px solid var(--teal);border-radius:9px;font:1.1rem/1.5 Georgia,serif;max-width:none}.intent-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:23px}.intent-grid h3{font:800 .73rem/1.2 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}.intent-grid ul{padding-left:20px;margin-top:7px}.intent-grid li{margin-bottom:8px}.steps-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0}.steps-nav a{background:#fff;border:1px solid var(--stroke);padding:8px 11px;text-decoration:none;border-radius:9px;font-size:.83rem;color:var(--ink);font-weight:700}.steps-nav a:hover{border-color:var(--teal)}.activity{padding:clamp(19px,3vw,34px);margin:19px 0;scroll-margin-top:14px}.activity .step-tag{font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}.activity h3{font:1.6rem/1.25 Georgia,serif;margin:8px 0 12px}.scenario{background:var(--blue);border-radius:10px;padding:14px 17px;max-width:none}.activity-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:17px}.activity-grid h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:10px}.activity-grid ol{padding-left:20px;margin:0}.activity-grid li{margin-bottom:10px}.contract{background:#f7f8f5;border-radius:10px;border:1px solid var(--stroke);padding:15px}.focus{font-family:Georgia,serif;font-style:italic}.noai{font-size:.82rem;color:#6c502c;margin:15px 0;background:var(--goldl);padding:8px 12px;border-radius:7px}.promptblock,.promptbox{border:1px solid #b3cfc7;background:#f3faf7;border-radius:10px;padding:12px;margin-top:15px}.promptblock pre,.promptbox pre{overflow:auto;white-space:pre-wrap;font-size:.81rem;max-height:300px}.promptblock button,.promptbox button{font-size:.77rem;padding:7px 10px;border:1px solid var(--teal);border-radius:7px;background:white;color:var(--teal);font-weight:700}.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.toolgrid article{border:1px solid var(--stroke);border-radius:10px;padding:15px;background:#fff}.prompthead{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.79rem;font-weight:750}.correction-kit{padding:16px;background:white;border:1px solid var(--stroke);border-radius:10px;margin-top:14px}.correction-kit h3{margin:12px 0}.write{margin-top:19px}.write label{font-weight:800;font-size:.85rem;display:block;margin-bottom:8px}.write textarea,.matrix textarea{display:block;width:100%;resize:vertical;min-height:112px;border:1px solid #bbcaca;border-radius:9px;padding:12px;background:#fff}.write small{color:var(--muted);font-size:.72rem}.bilan{margin-top:16px;border:1px solid #dccbb3;background:#fffbf4;border-radius:9px}.bilan summary{list-style:none;padding:13px 15px;cursor:pointer;font-weight:750;font-size:.87rem}.bilan-inner{padding:0 17px 16px}.bilan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.bilan-cell{padding:13px;border-radius:8px;background:white;border:1px solid #eee0c7}.bilan-cell h5{font-size:.8rem;color:#794a1d;text-transform:uppercase;margin:0 0 6px}.bilan-cell p{font-size:.85rem;margin:0}.sourcesused{font-size:.78rem;margin:12px 0 0}.ref-pill,.cite{display:inline-block;background:#dceee8;border:1px solid #b8d6ce;color:#155c56;border-radius:5px;padding:0 5px;margin:0 2px;text-decoration:none;font-weight:750;font-size:.78rem}.endactivity{display:flex;justify-content:space-between;margin-top:15px;font-size:.83rem}.done{display:flex;gap:8px;align-items:center}.resourcebox{padding:20px;margin:20px 0}.resourcebox summary{cursor:pointer;font-weight:750}.resourcebox .copy-card{margin-top:12px;padding:11px;border:1px solid var(--stroke);border-radius:8px}.resourcebox p{max-width:none}.synthesis{padding:clamp(24px,4vw,46px);margin-top:29px;background:linear-gradient(145deg,#f8fdfb,#fff)}.synthesis h2{max-width:900px}.synthesis .theory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:23px 0}.theory-item{border:1px solid var(--stroke);border-radius:11px;padding:17px;background:white}.theory-item h3{font-size:1.1rem;margin-bottom:9px}.theory-item p{font-size:.91rem;max-width:none}.synthesis .sourcebar{margin-top:14px;font-size:.82rem}.nextbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0}.matrix{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:20px}.matrix label{font-weight:700;display:block;margin:12px 0 5px}.smallnote{font-size:.82rem;color:var(--muted)}.banner{border-radius:12px;padding:18px;background:var(--goldl);border:1px solid #ebd2a4}.copy-card summary{font-weight:750;cursor:pointer}.copy-card p{font-size:.89rem}.copy-foot{color:#7d4b1c;font-weight:700}.toast{position:fixed;right:20px;bottom:20px;background:#183c3c;color:white;padding:11px 18px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}.screen{min-height:100vh}.topfloat{position:sticky;top:0;background:rgba(244,245,242,.96);backdrop-filter:blur(9px);padding:9px 0;z-index:10}.source-list{display:grid;gap:14px}.source-card{border:1px solid var(--stroke);border-radius:11px;padding:20px;background:white;scroll-margin-top:20px}.source-card h3{margin-bottom:6px}.source-card a{word-break:break-word}.source-card .cat{font-size:.75rem;color:var(--teal);font-weight:800;text-transform:uppercase}.slideshell{background:#0e202a;min-height:100vh;padding:2.5vh 3vw;color:#fff;display:flex;flex-direction:column}.slidebar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#a9c8c5;font-size:.85rem}.slidecard{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1250px;width:100%;margin:2.5vh auto;background:linear-gradient(130deg,#143842,#1b3940);border:1px solid #42666a;border-radius:23px;padding:clamp(26px,5vw,82px);min-height:66vh}.slidecard h1{font:clamp(2rem,4vw,4.3rem)/1.15 Georgia,serif;color:#fff;max-width:1000px}.slidecard p{max-width:1000px;font-size:clamp(1.15rem,2vw,1.65rem);line-height:1.55;color:#e7f4ed}.slidecard .cite{font-size:.75rem}.slidecard .eyebrow{color:#9fdac4}.slide-controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.slide-controls button{padding:10px 17px;border-radius:9px;background:#e2f5ef;color:#123e38;border:0;font-weight:800}.slide-controls button:disabled{opacity:.4}.slide-ref{font-size:.8rem;color:#a9c8c5}.slideshell a{color:#a8e9d4}.flex{display:flex;gap:10px;flex-wrap:wrap}.noscreen{display:none}

</style></head><body><div class="slideshell"><div class="slidebar"><span id="atelier-name">Bilan de l’atelier</span><span>Diaporama formateur · touches ← →</span><a href="index.html">Retour au parcours ↗</a></div><main class="slidecard" id="slide" aria-live="polite"><div class="eyebrow" id="label"></div><h1 id="slide-title"></h1><p id="slide-body"></p></main><div class="slide-controls"><button id="previous">← Précédente</button><span id="counter">1 / 6</span><button id="next">Suivante →</button></div></div><script>const m={"O": [{"title": "Notre question : l’IA fait-elle davantage penser l’élève ?", "body": "Nous nous sommes mis momentanément à la place d’un élève sur une même tâche : problématiser « Peut-on vouloir la vérité à tout prix ? ». Trois prompts ont été testés dans des conversations neuves : réponse directe, aide guidée et questions sans solution."}, {"title": "Ce que les stagiaires ont réellement testé", "body": "Avant l’IA : un écrit personnel. Prompt 1 : une problématique et un plan. Prompt 2 : des étapes et indices successifs. Prompt 3 : une relance philosophique, une question à la fois. Après chaque essai : ce que j’ai produit moi-même et ce que l’IA a fourni."}, {"title": "Retour en posture d’enseignant : modifier, puis retester", "body": "Les collègues ont confronté leurs extraits, identifié un guidage trop directif ou trop vague, rédigé un prompt 4 et l’ont testé à nouveau. Ils ont ensuite proposé une version C de la séance, avec retrait de l’aide et tâche individuelle sans IA."}, {"title": "Repères théoriques pour interpréter, sans surconclure", "body": "Tozzi : problématiser, conceptualiser, argumenter. Dewey : l’enquête face à une difficulté. Chi et Wylie : qualité des activités cognitives. Soderstrom et Bjork : performance assistée n’est pas synonyme d’apprentissage durable. [TOZ] [DEW] [ICA] [PER]"}, {"title": "Trois questions avant d’adopter un prompt", "body": "1. Quelle opération de pensée attend-on de l’élève ? 2. Qu’a-t-il effectivement construit durant l’échange, avec quelle preuve ? 3. Comment saura-t-il réinvestir la démarche sur une tâche nouvelle sans IA ? Le prompt et la séance doivent être jugés ensemble."}, {"title": "Ce que nous pouvons conclure — et ce que nous ne pouvons pas", "body": "La simulation renseigne sur les types d’assistance et fait émerger des hypothèses professionnelles. Elle ne démontre pas un effet chez des lycéens : les stagiaires sont experts et les traces de classe sont fictives. Une véritable évaluation exigerait des productions autonomes d’élèves. [PER] [BO]"}], "M1": [{"title": "Notre question : comprendre Descartes ou recevoir son explication ?", "body": "Vous avez travaillé sur deux extraits authentiques, directement affichés. Question commune : Descartes prouve-t-il que toutes les opinions sont fausses ? Une réponse initiale sans IA sert de point de comparaison."}, {"title": "Expérience 1 : mon écrit avant / après la réponse directe", "body": "Vous avez rédigé votre première lecture, obtenu une explication de l’IA et vérifié dans le texte ses formulations. La comparaison porte sur la justification, pas sur la seule élégance du résultat."}, {"title": "Expérience 2 : trois médiations réellement vécues", "body": "Prompt 1 : corrigé direct. Prompt 2 : glossaire et segmentation. Prompt 3 : questions sur des expressions précises. Qu’avez-vous réellement dû chercher, expliquer et justifier dans chaque essai ?"}, {"title": "Expérience 3 : tester les limites du tuteur", "body": "Vous avez répondu comme un élève, introduit une erreur et demandé un corrigé. L’analyse des six tours distingue les opérations produites par vous et celles fournies par l’IA. Le prompt a ensuite été modifié et retesté."}, {"title": "Test de sortie : un nouveau passage sans IA", "body": "Sur le passage concernant les sens, chacun a dû citer une expression, expliquer une distinction et proposer une inférence. Ce transfert est une première trace d’autonomie, non une preuve définitive d’efficacité dans une classe réelle."}, {"title": "Repères pour décider comme professeur", "body": "Descartes : le doute méthodique ne démontre pas la fausseté de toute opinion. Chi : auto-explication ; Chi et Wylie : ICAP ; Sweller : charge cognitive ; Soderstrom et Bjork : performance immédiate versus apprentissage. Garder une aide uniquement si elle laisse un travail philosophique visible à l’élève. [DES] [EXP] [ICA] [SWE] [PER]"}], "M2": [{"title": "Question directrice", "body": "Le contradicteur doit-il produire le paradoxe, ou permettre à l’élève de découvrir la limite de sa première évidence ?"}, {"title": "Philosophie et jugement", "body": "Kant fait de l’usage de son propre entendement un enjeu d’émancipation ; Dewey décrit l’enquête comme passage d’un trouble initial à un examen des raisons. Le tuteur ne doit pas être une nouvelle autorité intellectuelle. [KAN] [DEW]"}, {"title": "Recherche et limites", "body": "Kapur montre, dans un contexte situé, l’intérêt possible d’une recherche initiale difficile suivie d’une consolidation ; ICAP distingue une conversation superficielle d’une co-construction de propositions nouvelles. [KAP] [ICA]"}, {"title": "Conception du tuteur", "body": "Le tuteur : demande une thèse provisoire ; sollicite la raison ; présente un cas qui résiste ; laisse l’élève expliquer ce cas ; exige une reformulation du problème ; s’arrête avant d’écrire le plan."}, {"title": "Institutionnalisation", "body": "Écrire sans IA : une thèse, la meilleure objection et une réponse motivée. Examiner les transitions et l’élaboration conceptuelle selon les objectifs du bac, sans automatiser un plan « oui/non/synthèse ». [BO] [TOZ]"}, {"title": "Références pour approfondir", "body": "Emmanuel Kant (1784) — Réponse à la question : Qu’est-ce que les Lumières ? [KAN] · Michel Tozzi (2006) — Enseigner la problématisation, ou plutôt apprendre à problématiser ? [TOZ] · John Dewey (1910) — How We Think [DEW] · Manu Kapur (2008) — Productive Failure [KAP] · Chi & Wylie (2014) — The ICAP Framework [ICA] · Bastani et al. (2025) — Generative AI Without Guardrails Can Harm Learning [BAST]"}], "M3": [{"title": "Question directrice", "body": "Une affirmation peut être bien attribuée mais mal interprétée ; exacte mais non pertinente ; séduisante mais non étayée."}, {"title": "Pratique philosophique", "body": "L’attribution à Arendt constitue ici un objet d’enquête : distinguer ce qu’elle écrit de ce qu’on lui fait dire. Bachelard rappelle que les premières évidences méritent examen ; Dewey invite à chercher des éléments qui confirment ou infirment une proposition. [ARE] [BAC] [DEW]"}, {"title": "Trois verdicts distincts", "body": "Provenance : retrouve-t-on la source primaire ? Exactitude : la formulation ou paraphrase est-elle fidèle ? Validité/pertinence : l’inférence tient-elle et répond-elle au problème ? Ne jamais confondre ces niveaux."}, {"title": "Activité intellectuelle des élèves", "body": "Former les élèves à formuler une requête vérifiable, consulter une édition, comparer les passages, reconstruire un argument et expliciter un degré d’incertitude ; une seconde IA ne remplace pas la source primaire."}, {"title": "Institutionnalisation", "body": "L’IA est un texte à examiner, non un arbitre de vérité. Définir un protocole commun de citation et de vérification ; le cadre ministériel et l’UNESCO insistent sur l’esprit critique et l’agentivité humaine. [MEN] [UNG]"}, {"title": "Références pour approfondir", "body": "Hannah Arendt (1971) — Thinking and Moral Considerations (référence bibliographique) [ARE] · René Descartes, première Méditation (1641 ; trad. fr. 1647) — Méditations métaphysiques, projet Descartes (Université de Caen) [DES] · John Dewey (1910) — How We Think [DEW] · Gaston Bachelard (1938) — La formation de l’esprit scientifique, chapitre I [BAC] · MEN (2025) — Cadre d’usage de l’IA en éducation [MEN] · UNESCO (2023) — Guidance for Generative AI in Education and Research [UNG]"}], "M4": [{"title": "Question directrice", "body": "Différencier n’est pas attribuer trois exercices de valeur philosophique différente à trois catégories d’élèves."}, {"title": "Principe didactique", "body": "L’invariant est commun : analyser un concept, étayer une inférence, soumettre une thèse à objection. Varient la lisibilité, la quantité d’indices et la voie de restitution, puis les aides sont retirées."}, {"title": "Appuis de recherche", "body": "CAST propose de concevoir plusieurs moyens d’accès et de participation ; la théorie de la charge cognitive invite à alléger les traitements périphériques ; la recherche sur le guidage rappelle que le besoin d’aide dépend aussi des acquis préalables. [UDL] [SWE] [KIR]"}, {"title": "Feedback transformateur", "body": "Nicol et Macfarlane-Dick relient feedback et autorégulation. Hattie et Timperley montrent des effets variables selon le niveau de commentaire : viser la tâche et le processus plutôt qu’un compliment générique. [NIC] [HAT]"}, {"title": "Institutionnalisation", "body": "Chaque support doit conduire à une nouvelle production autonome sur un même critère exigeant. Ne pas importer d’étiquettes médicales ni inférer des profils stables à partir d’une copie. [UDL] [CNIL]"}, {"title": "Références pour approfondir", "body": "CAST (2024) — Universal Design for Learning Guidelines, 3.0 [UDL] · John Sweller (1988) — Cognitive Load During Problem Solving: Effects on Learning [SWE] · Kirschner, Sweller & Clark (2006) — Why Minimal Guidance During Instruction Does Not Work [KIR] · Chi & Wylie (2014) — The ICAP Framework [ICA] · Nicol & Macfarlane-Dick (2006) — Formative Assessment and Self-Regulated Learning [NIC] · Hattie & Timperley (2007) — The Power of Feedback [HAT]"}], "M5": [{"title": "Question directrice", "body": "Le dialogue entre le correcteur et l’IA ne sert pas à produire une note moyenne : il aide à justifier un jugement professionnel et à préparer les apprentissages suivants."}, {"title": "Cadre officiel 2027", "body": "La note de service prévoit une évaluation globale : connaissances et réflexion ne sont pas dissociables ; identifier un problème, lire, conceptualiser, raisonner, argumenter et écrire avec méthode s’apprécient ensemble. Pas de micro-barème officiel à inventer. [BO] [BOA]"}, {"title": "Recherche sur l’évaluation", "body": "Sadler analyse l’écart entre qualité visée, production actuelle et action possible ; Carless et Boud pensent la littératie du feedback comme capacité à l’interpréter et à l’employer ; Hattie et Timperley soulignent la variabilité des effets. [SAD] [CAR] [HAT]"}, {"title": "Protocole de correction", "body": "Jugement initial indépendant sur copies fictives → sortie IA comme second lecteur → vérification des assertions contre le texte → arbitrage professoral argumenté → regroupements provisoires des obstacles de classe → réenseignement et nouvelle preuve."}, {"title": "Décision éthique et didactique", "body": "Ne pas soumettre de copies identifiables à un service grand public ; ne pas déléguer l’attribution d’une note ou d’une décision. Pour chaque élève : un obstacle prioritaire, une action précise, une réécriture, puis une observation différée. [CNIL] [MEN]"}, {"title": "Références pour approfondir", "body": "MEN, note MENE2622661N (2026) — Épreuve terminale de philosophie, applicable en 2027 [BO] · MEN (2026) — Annexe : échelle descriptive des niveaux de maîtrise [BOA] · Éduscol (2026) — Programmes et ressources en philosophie, voie GT [EDU] · D. Royce Sadler (1989) — Formative Assessment and the Design of Instructional Systems [SAD] · Nicol & Macfarlane-Dick (2006) — Formative Assessment and Self-Regulated Learning [NIC] · Hattie & Timperley (2007) — The Power of Feedback [HAT] · Carless & Boud (2018) — The Development of Student Feedback Literacy [CAR] · CNIL (2025) — Enseignant : comment utiliser un système d’IA dans le cadre de vos missions ? [CNIL]"}], "M6": [{"title": "Question directrice", "body": "La transposition est une enquête professionnelle : la séquence doit pouvoir être critiquée et améliorée par d’autres enseignants."}, {"title": "Articulation philosophique", "body": "Les opérations de problématisation, conceptualisation et argumentation constituent des cibles didactiques observables, sans réduire la discipline à trois cases indépendantes. Le programme et le BO évaluent une démarche singulière d’ensemble. [TOZ] [BO]"}, {"title": "Principe de validité", "body": "Définir avant la séance une trace initiale, une trace après médiation et un transfert autonome, éventuellement différé. Un résultat inattendu ne sera pas masqué par la satisfaction des usagers. [PER]"}, {"title": "Matrice de conception", "body": "Obstacle documenté → compétence visée → tâche sans IA → rôle limité de l’IA → modalité d’accès alternative → tâche finale autonome → indicateur de progrès → décision de poursuivre, modifier ou abandonner."}, {"title": "Bilan professionnel", "body": "L’UNESCO place l’agentivité humaine au centre ; le cadre national demande une plus-value pédagogique justifiable. Le bon usage est celui que l’enseignant peut expliquer, défendre et réviser. [UNE] [MEN]"}, {"title": "Références pour approfondir", "body": "MEN, note MENE2622661N (2026) — Épreuve terminale de philosophie, applicable en 2027 [BO] · Michel Tozzi (2006) — Enseigner la problématisation, ou plutôt apprendre à problématiser ? [TOZ] · Soderstrom & Bjork (2015) — Learning Versus Performance: An Integrative Review [PER] · CAST (2024) — Universal Design for Learning Guidelines, 3.0 [UDL] · UNESCO (2024) — AI Competency Framework for Teachers [UNE] · MEN (2025) — Cadre d’usage de l’IA en éducation [MEN]"}]}
