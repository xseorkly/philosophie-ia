*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--teal)}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #d3943c;outline-offset:3px}h1,h2,h3,h4,p{margin-top:0}h1,h2,.serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.02em}h1{font-size:clamp(2.1rem,4vw,4rem);line-height:1.1}h2{font-size:clamp(1.7rem,2.7vw,2.6rem);line-height:1.2}h3{font-size:1.34rem}p{max-width:78ch}.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:850;color:var(--teal)}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{background:#122d36;color:#e6eff1;padding:28px 17px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}.sidebar .brand{padding:0 12px 20px}.brand strong{display:block;font:1.42rem Georgia,serif;letter-spacing:-.02em}.brand p{color:#b5c9c9;font-size:.82rem;margin:.65rem 0 0}.navtitle{margin:18px 12px 9px;font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:#a5c9be;font-weight:750}.atelier-link{display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;color:#d8e4e5;text-align:left;background:none;border:0;width:100%;line-height:1.23}.atelier-link:hover,.atelier-link.active{background:#24505a;color:white}.atelier-link .num{display:grid;place-items:center;min-width:29px;height:29px;border:1px solid #4f777d;border-radius:8px;color:#afdbd1;font-size:.75rem}.atelier-link b{font-weight:650;font-size:.9rem}.atelier-link small{display:block;color:#b6cbd0;font-size:.74rem;margin-top:5px}.tools{margin-top:auto;border-top:1px solid #34525d;padding:18px 10px}.tools button,.tools label{font-size:.79rem;display:block;width:100%;border:1px solid #5a7d84;color:white;background:transparent;padding:9px;border-radius:9px;text-align:left;margin:6px 0}.tools label input{width:100%;margin-top:5px;color:white;font-size:.75rem}.tools p{color:#aec4c7;font-size:.73rem}.stage{width:100%;padding:26px min(4vw,70px) 90px;max-width:1540px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--stroke);padding:0 0 17px;margin:0 0 24px}.toolbar a{text-decoration:none;font-size:.84rem;font-weight:700}.pill{border:1px solid var(--stroke);border-radius:999px;background:var(--paper);font-size:.75rem;color:var(--muted);padding:5px 10px}.workshop[hidden],.screen[hidden]{display:none!important}.cover,.intro,.panel,.activity,.synthesis,.resourcebox{background:var(--paper);border:1px solid var(--stroke);border-radius:18px;box-shadow:var(--shadow)}.cover{padding:clamp(23px,5vw,65px);background:linear-gradient(110deg,#fff 55%,#e8f4f0)}.cover .lead{font-size:1.15rem;max-width:58ch}.cover-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{background:var(--teal);color:white;border:1px solid var(--teal);border-radius:10px;padding:11px 17px;font-weight:750;display:inline-flex;align-items:center;gap:8px;text-decoration:none}.btn:hover{background:#0b4e4a}.btn.secondary{background:#fff;color:var(--teal);border-color:#9dc6bb}.btn.ghost{background:transparent;border:1px solid var(--stroke);color:var(--ink)}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px}.tile{border:1px solid var(--stroke);border-radius:13px;padding:21px;background:#fff;text-align:left;box-shadow:var(--shadow)}.tile:hover{border-color:#78afa4;transform:translateY(-1px)}.tile span{font-size:.75rem;color:var(--teal);font-weight:800}.tile h3{font-family:Georgia,serif;margin:9px 0 8px}.tile p{font-size:.89rem;color:var(--muted);margin:0}.intro{padding:clamp(22px,4vw,48px)}.intro h1{font-size:clamp(2rem,3.4vw,3.5rem);max-width:850px}.intro .problem{background:var(--teall);padding:17px x(0,1fr));gap:13px}.toolgrid article{border:1px solid var(--stroke);border-radius:10px;padding:15px;background:#fff}.prompthead{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.79rem;font-weight:750}.correction-kit{padding:16px;background:white;border:1px solid var(--stroke);border-radius:10px;margin-top:14px}.correction-kit h3{margin:12px 0}.write{margin-top:19px}.write label{font-weight:800;font-size:.85rem;display:block;margin-bottom:8px}.write textarea,.matrix textarea{display:block;width:100%;resize:vertical;min-height:112px;border:1px solid #bbcaca;border-radius:9px;padding:12px;background:#fff}.write small{color:var(--muted);font-size:.72rem}.bilan{margin-top:16px;border:1px solid #dccbb3;background:#fffbf4;border-radius:9px}.bilan summary{list-style:none;padding:13px 15px;cursor:pointer;font-weight:750;font-size:.87rem}.bilan-inner{padding:0 17px 16px}.bilan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.bilan-cell{padding:13px;border-radius:8px;background:white;border:1px solid #eee0c7}.bilan-cell h5{font-size:.8rem;color:#794a1d;text-transform:uppercase;margin:0 0 6px}.bilan-cell p{font-size:.85rem;margin:0}.sourcesused{font-size:.78rem;margin:12px 0 0}.ref-pill,.cite{display:inline-block;background:#dceee8;border:1px solid #b8d6ce;color:#155c56;border-radius:5px;padding:0 5px;margin:0 2px;text-decoration:none;font-weight:750;font-size:.78rem}.endactivity{display:flex;justify-content:space-between;margin-top:15px;font-size:.83rem}.done{display:flex;gap:8px;align-items:center}.resourcebox{padding:20px;margin:20px 0}.resourcebox summary{cursor:pointer;font-weight:750}.resourcebox .copy-card{margin-top:12px;padding:11px;border:1px solid var(--stroke);border-radius:8px}.resourcebox p{max-width:none}.synthesis{padding:clamp(24px,4vw,46px);margin-top:29px;background:linear-gradient(145deg,#f8fdfb,#fff)}.synthesis h2{max-width:900px}.synthesis .theory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:23px 0}.theory-item{border:1px solid var(--stroke);border-radius:11px;padding:17px;background:white}.theory-item h3{font-size:1.1rem;margin-bottom:9px}.theory-item p{font-size:.91rem;max-width:none}.synthesis .sourcebar{margin-top:14px;font-size:.82rem}.nextbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0}.matrix{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:20px}.matrix label{font-weight:700;display:block;margin:12px 0 5px}.smallnote{font-size:.82rem;color:var(--muted)}.banner{border-radius:12px;padding:18px;background:var(--goldl);border:1px solid #ebd2a4}.copy-card summary{font-weight:750;cursor:pointer}.copy-card p{font-size:.89rem}.copy-foot{color:#7d4b1c;font-weight:700}.toast{position:fixed;right:20px;bottom:20px;background:#183c3c;color:white;padding:11px 18px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}.screen{min-height:100vh}.topfloat{position:sticky;top:0;background:rgba(244,245,242,.96);backdrop-filter:blur(9px);padding:9px 0;z-index:10}.source-list{display:grid;gap:14px}.source-card{border:1px solid var(--stroke);border-radius:11px;padding:20px;background:white;scroll-margin-top:20px}.source-card h3{margin-bottom:6px}.source-card a{word-break:break-word}.source-card .cat{font-size:.75rem;color:var(--teal);font-weight:800;text-transform:uppercase}.slideshell{background:#0e202a;min-height:100vh;padding:2.5vh 3vw;color:#fff;display:flex;flex-direction:column}.slidebar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#a9c8c5;font-size:.85rem}.slidecard{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1250px;width:100%;margin:2.5vh auto;background:linear-gradient(130deg,#143842,#1b3940);border:1px solid #42666a;border-radius:23px;padding:clamp(26px,5vw,82px);min-height:66vh}.slidecard h1{font:clamp(2rem,4vw,4.3rem)/1.15 Georgia,serif;color:#fff;max-width:1000px}.slidecard p{max-width:1000px;font-size:clamp(1.15rem,2vw,1.65rem);line-height:1.55;color:#e7f4ed}.slidecard .cite{font-size:.75rem}.slidecard .eyebrow{color:#9fdac4}.slide-controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.slide-controls button{padding:10px 17px;border-radius:9px;background:#e2f5ef;color:#123e38;border:0;font-weight:800}.slide-controls button:disabled{opacity:.4}.slide-ref{font-size:.8rem;color:#a9c8c5}.slideshell a{color:#a8e9d4}.flex{display:flex;gap:10px;flex-wrap:wrap}.noscreen{display:none}

</style></head><body><div class="slideshell"><div class="slidebar"><select id="pick" aria-label="Choisir le module" style="background:#143842;color:#e7f4ed;border:1px solid #42666a;border-radius:8px;padding:6px 8px"></select><span>Diaporama formateur · ← → pour naviguer · F plein écran</span><a id="back" href="index.html">Retour au parcours ↗</a></div><main class="slidecard" id="slide" aria-live="polite"><div class="eyebrow" id="label"></div><h1 id="slide-title"></h1><p id="slide-body"></p></main><div class="slide-controls"><button id="previous" type="button">← Précédente</button><span id="counter"></span><button id="next" type="button">Suivante →</button></div></div><script>const m={"O": [{"title": "Question directrice", "body": "Une aide fait mieux philosopher si elle laisse à l’élève l’épreuve de la tension. Sinon elle améliore le texte et prive l’élève de l’activité qui l’aurait fait apprendre."}, {"title": "Sciences cognitives", "body": "L’effet de génération et la distinction performance / apprentissage expliquent pourquoi une problématique reçue est vite oubliée, et pourquoi l’écrit initial rend l’aide utile."}, {"title": "Didactique", "body": "Dévolution, désétayage, inversion de l’effet d’expertise : l’aide se calibre sur la trace de l’élève et se retire sur un indice observable."}, {"title": "Philosophie", "body": "Tozzi décrit la problématisation comme un processus ; Dewey fait naître la pensée d’une perplexité. Une aide qui supprime la perplexité supprime la pensée."}, {"title": "Décision", "body": "Définir l’apprentissage, choisir l’aide, prévoir son retrait et la preuve sans aide. Ne pas utiliser l’IA reste une réponse recevable. [TOZ] [DEW] [GEN] [PER] [KAL] [BRO]"}], "M1": [{"title": "Question directrice", "body": "Expliquer un texte, c’est en éprouver la résistance. Une explication fluide peut supprimer l’objet même de l’exercice."}, {"title": "Sciences cognitives", "body": "Illusion de compréhension par la fluidité, illusion de profondeur explicative, auto-explication, charge intrinsèque : quatre raisons de faire expliquer l’élève plutôt que de lui expliquer."}, {"title": "Didactique", "body": "L’obstacle de R2 est conceptuel. Il ne se lève pas par une explication correcte mais par une confrontation de l’élève à une expression précise du texte."}, {"title": "Transfert", "body": "Le nouveau passage prouve un transfert proche ; un transfert lointain et une reprise différée sont nécessaires pour parler d’acquisition."}, {"title": "Décision", "body": "Lever le lexique, préserver l’inférence, faire expliquer avant de vérifier, prévoir la lecture d’un nouveau passage sans aide. [DES] [FLU] [IOED] [EXP] [SWE] [GIC]"}], "M2": [{"title": "Question directrice", "body": "Le contradicteur doit permettre à l’élève de découvrir la limite de sa première évidence, non lui décrire cette limite."}, {"title": "Épistémologie", "body": "Bachelard : on connaît contre une connaissance antérieure. L’obstacle doit être éprouvé par celui qui le rencontre."}, {"title": "Sciences cognitives", "body": "L’échec productif, la complaisance des modèles et la distinction entre engagement actif, constructif et interactif expliquent le succès ou l’échec du dialogue."}, {"title": "Didactique", "body": "Le crash-test met à l’épreuve le contrat didactique : l’élève attend la réponse, le tuteur doit rompre ce contrat."}, {"title": "Institutionnalisation", "body": "Écrire sans IA une thèse, la meilleure objection et une réponse motivée, et justifier ses révisions. [BAC] [KAP] [SYC] [ICA] [BRO] [TOZ]"}], "M3": [{"title": "Question directrice", "body": "Que vaut un témoignage sans témoin ? Une réponse d’IA n’a ni auteur responsable, ni intention, ni source identifiable."}, {"title": "Sciences cognitives", "body": "Vigilance épistémique, effet de vérité par la fluidité, biais d’automatisation : nos mécanismes de confiance sont mal ajustés à un interlocuteur sans source et toujours assuré."}, {"title": "Trois verdicts distincts", "body": "Provenance, validité de l’inférence, pertinence pour le problème : trois compétences à travailler séparément."}, {"title": "Philosophie", "body": "Distinguer ce qu’écrit Arendt de ce qu’on lui fait dire ; arbitrer entre deux lectures de Rousseau à partir du texte ; Bachelard et Dewey sur l’examen des évidences."}, {"title": "Institutionnalisation", "body": "L’IA est un texte à examiner, non un arbitre. « Non vérifié » est une conclusion légitime ; l’indépendance des sources est un critère. [SPE] [FLU] [AUT] [HAL] [ARE] [BAC]"}], "M4": [{"title": "Question directrice", "body": "Différencier, ce n’est pas attribuer trois exercices de valeur différente : c’est varier l’accès en conservant l’objet intellectuel."}, {"title": "Charge cognitive", "body": "Réduire la charge extrinsèque est légitime ; réduire la charge intrinsèque supprime l’apprentissage. Ce qui aide un novice peut gêner un élève avancé."}, {"title": "Retour", "body": "Un retour peut nuire. Il est efficace quand il porte sur la tâche et le processus, propose une action et vise l’autorégulation."}, {"title": "Accessibilité", "body": "Plusieurs voies d’accès, une même exigence, des aides activables et retirables, un plan B sans IA."}, {"title": "Institutionnalisation", "body": "Chaque support conduit à une nouvelle production autonome sur le même critère exigeant ; pas d’étiquettes médicales ni de profils figés. [SWE] [KAL] [KLU] [HAT] [NIC] [UDL]"}], "M5": [{"title": "Question directrice", "body": "Le dialogue entre correcteur et IA ne sert pas à produire une note moyenne : il aide à justifier un jugement et à préparer les apprentissages suivants."}, {"title": "Docimologie", "body": "La note est un jugement fragile ; les écarts entre correcteurs sont structurels. L’IA ajoute un jugement à discuter, non une mesure."}, {"title": "Biais", "body": "Ancrage et biais d’automatisation imposent un ordre : juger d’abord, confronter ensuite, justifier chaque remarque retenue par un passage de la copie."}, {"title": "Cadre officiel 2027", "body": "Évaluation globale de la démarche ; pas de micro-barème à inventer."}, {"title": "Retour et reprise", "body": "Un obstacle prioritaire, une action, une réécriture, une observation différée : sans tâche de reprise, le meilleur retour reste sans effet. [PIE] [MER] [ANC] [AUT] [BO] [CAR]"}], "M6": [{"title": "Question directrice", "body": "Une séance avec IA est une hypothèse didactique : si l’élève fait ceci avec cette aide, il saura ensuite faire cela seul. Elle se conçoit, se teste et se révise comme telle."}, {"title": "Concevoir", "body": "La matrice articule l’obstacle et son origine supposée, le mécanisme cognitif visé, le concept didactique, l’aide et son retrait, la preuve sans aide et différée, ce qui fausserait la conclusion et le critère d’abandon."}, {"title": "Tester", "body": "Le test entre pairs déjoue l’implicite du concepteur ; l’audit par l’IA fournit des hypothèses à vérifier, jamais un verdict."}, {"title": "Itérer", "body": "La recherche orientée par la conception procède par cycles courts : une version, une trace, une révision. Une recherche-action modeste vaut mieux qu’une promesse d’efficacité."}, {"title": "S’engager", "body": "Des intentions de mise en œuvre datées et une trace prévue : c’est l’effet observé chez vos élèves qui fera durer, ou réviser, ce que vous avez appris ici. [DBR] [CUR] [AUT] [GOL] [GUS] [PER]"}], "N1": [{"title": "Deux copies, un vote", "body": "Une introduction maladroite qui pose un vrai problème, une introduction fluide qui répète le sujet. Laquelle vient de l’IA ? Laquelle mérite la meilleure note ?"}, {"title": "Ce que fait la copie X", "body": "Elle part d’une évidence, la confronte à un cas qui résiste et formule une tension : vouloir la vérité « pour nous ou contre nous ». C’est un début de problématisation."}, {"title": "Ce que fait la copie Y", "body": "Autorité décorative, sujet reformulé en question, plan thèse / limites / synthèse : toutes les apparences du travail attendu, sans difficulté examinée."}, {"title": "Le danger pour la classe", "body": "Si nos critères récompensent d’abord la fluidité, déléguer à l’IA devient rationnel pour l’élève. [TOZ] [BO]"}, {"title": "Trois questions pour tout le parcours", "body": "Quelle opération philosophique reste à l’élève ? Quelle trace la montre ? Que sait-il faire ensuite seul ?"}, {"title": "Où en sommes-nous ?", "body": "Photo de la ligne du débat mouvant et positionnement individuel : on les refera au module 9."}], "N2": [{"title": "Pourquoi vérifier ? Parce qu’on sait comment ça marche", "body": "Un modèle de langage prolonge un texte avec la suite la plus plausible. Plausible ne veut pas dire vrai. [BEN]"}, {"title": "Il ne consulte pas de bibliothèque", "body": "Sauf recherche explicite, une référence peut être fabriquée parce qu’elle ressemble aux références habituelles. [HAL]"}, {"title": "Il cherche à plaire", "body": "Il change d’avis sous la pression et félicite un texte faible si on lui dit en être fier : c’est la complaisance. [SYC]"}, {"title": "Il varie", "body": "La même question donne des réponses différentes. Deux IA d’accord ne font pas une preuve."}, {"title": "Ce que nos démonstrations ont montré", "body": "Variabilité, soumission au cadrage de la question, complaisance, désaccord : quatre raisons de ne jamais citer une IA comme une source."}, {"title": "Conséquence didactique", "body": "Vérifier devient une compétence enseignée : demander la source, la chercher, comparer, conclure « vérifié / faux / non vérifiable ». [MEN]"}], "N3": [{"title": "Six risques, pas un seul", "body": "Délégation, illusion de compréhension, faux soupçon, dépendance affective, données personnelles, uniformisation et inégalités."}, {"title": "Le risque majeur", "body": "Ce n’est pas que l’élève triche : c’est qu’il cesse de penser en croyant apprendre. Les premières études vont dans ce sens, avec prudence. [GER]"}, {"title": "Les détecteurs ne prouvent rien", "body": "Peu fiables, ils pénalisent davantage les élèves qui écrivent dans une langue seconde. Jamais de sanction sur un score. [DET]"}, {"title": "Des copies qui se ressemblent", "body": "Les productions assistées sont plus homogènes entre elles : la singularité de la pensée est en jeu. [DIV]"}, {"title": "Protéger", "body": "Aucune donnée personnelle dans un service grand public ; orienter l’élève isolé vers les adultes ressources ; ne jamais rendre l’outil nécessaire à la réussite. [CNIL] [MEN]"}, {"title": "Concevoir plutôt que détecter", "body": "Traces de travail, écrit en classe, oral de soutenance, déclaration d’usage : rendre la délégation inutile."}], "N6": [{"title": "Question directrice", "body": "L’IA peut alléger la préparation sur les tâches où le professeur reconnaît vite l’erreur. Le gain se compte sélection et vérification comprises."}, {"title": "Didactique", "body": "Un exemple généré n’est pas transposé : il faut le choisir et l’ordonner pour qu’il serve un problème. La variation des cas fait abstraire la distinction."}, {"title": "Sciences cognitives", "body": "Le biais d’automatisation touche aussi le professeur ; le délestage de la préparation peut appauvrir sa propre compréhension de la notion."}, {"title": "Cadre", "body": "Usage professionnel admis sous réserve de vérification ; textes pris dans des éditions ; aucune donnée d’élève. [CHE] [GIC] [AUT] [RIS] [MEN]"}], "N8": [{"title": "Une machine qui parle pense-t-elle ?", "body": "La philosophie dispose de concepts pour penser ce que nous avons vécu pendant la formation."}, {"title": "Platon : le remède et le poison", "body": "Dans le Phèdre, l’écriture promise comme remède à la mémoire produirait l’oubli et une apparence de savoir. [PLA]"}, {"title": "Descartes : le langage comme signe de la pensée", "body": "Une machine ne saurait arranger ses paroles pour répondre au sens de tout ce qu’on lui dit. Ce critère tient-il encore ? [DSD]"}, {"title": "Turing et Searle", "body": "Turing remplace la question par un test d’imitation ; Searle répond que manipuler des symboles n’est pas comprendre. [TUR] [SEA]"}, {"title": "Une pharmacologie de la technique", "body": "Chaque technique peut soigner ou empoisonner selon l’usage : c’est le discernement que la formation a exercé. [STI]"}, {"title": "Le paradoxe de l’éducation", "body": "Kant : unir une contrainte légitime et l’usage de sa liberté. L’IA est-elle le tuteur commode qui maintient dans la minorité ? [KAN]"}, {"title": "En classe", "body": "L’IA comme objet de cours : la technique, le langage, la conscience, la vérité, le travail. Toujours un texte, toujours un écrit personnel."}], "N4": [{"title": "Déléguer est un calcul, pas un vice", "body": "L’effort mental est un coût mis en balance avec la valeur attendue du résultat : l’élève délègue au point de difficulté maximale. [KOO] [SHE]"}, {"title": "La fluidité donne l’illusion de savoir", "body": "Un texte facile à lire produit un sentiment de compréhension ; on surestime ce qu’on croit pouvoir expliquer. [FLU] [IOED]"}, {"title": "Ce qu’on ne produit pas, on le retient mal", "body": "Effet de génération, effort de récupération : la pensée produite par soi se consolide, la pensée reçue s’efface. [GEN] [RET]"}, {"title": "Performer n’est pas apprendre", "body": "Avec un assistant libre, les exercices s’améliorent et l’examen sans aide se dégrade ; un tuteur bridé limite la perte. [BAST] [FAN]"}, {"title": "Ce que la recherche ne dit pas encore", "body": "Peu d’études en philosophie, des prépublications frappantes mais fragiles, des corrélations sans causalité : à citer avec prudence. [KOS] [GER]"}, {"title": "Concevoir plutôt qu’interdire", "body": "Jalonner, faire produire avant l’aide, rappeler à distance, évaluer sans aide, valoriser le brouillon. [SDT] [PER]"}], "N5": [{"title": "L’effet Topaze automatisé", "body": "Le tuteur réduit la question jusqu’à ce que l’élève n’ait plus qu’à dire oui : la réponse est obtenue, la connaissance a disparu. [BRO]"}, {"title": "L’effet Jourdain", "body": "« Tu l’as construite toi-même » : reconnaître un savoir que l’élève n’a pas produit installe un faux sentiment de compétence."}, {"title": "La dévolution", "body": "Faire accepter à l’élève la responsabilité du problème suppose que la réponse ne lui soit pas donnée."}, {"title": "Six fonctions de l’étayage", "body": "Enrôlement, réduction des degrés de liberté, maintien de l’orientation, signalisation, contrôle de la frustration, démonstration. [WBR]"}, {"title": "Ce qui reste au professeur", "body": "Diagnostic de la zone proximale, décision de désétayage, institutionnalisation. [VYG]"}, {"title": "Le malentendu", "body": "Produire un texte conforme ou exercer une activité de pensée : l’IA rend le malentendu rentable. Nos exercices doivent rendre l’activité visible. [BAU]"}], "N7": [{"title": "Septembre : l’IA comme premier problème de l’année", "body": "Écrire d’abord, éprouver la machine, lire le Phèdre, problématiser, instituer la charte, réécrire. [PLA]"}, {"title": "Une charte par niveaux d’usage", "body": "Sans IA, comprendre, s’entraîner, améliorer, étudier l’IA : un niveau annoncé pour chaque exercice. [AIAS]"}, {"title": "La déclaration d’usage", "body": "Un exercice métacognitif autant qu’un contrôle : distinguer ce que j’ai produit de ce que j’ai reçu."}, {"title": "Une progression de l’autonomie", "body": "De l’usage encadré à l’autonomie sans outil pour l’épreuve : le désétayage à l’échelle de l’année."}, {"title": "Des rituels qui rendent la pensée visible", "body": "Écrit-flash, carnet de pensée, oral de soutenance, question de vérification, retour sur erreur. [RET] [GEN]"}, {"title": "Les situations délicates", "body": "Entretien plutôt que détecteur, attention aux élèves fragiles et allophones, lien avec les familles et l’équipe. [DET] [MEN]"}]};const T={"N1": "Module 1 · Deux copies", "N2": "Module 2 · Comprendre la machine", "N4": "Module 3 · Pourquoi l’élève délègue", "N3": "Module 4 · Les risques pour l’élève", "N5": "Module 5 · Didactique de l’étayage", "O": "Module 6A · Trois usages face à un sujet", "M1": "Module 6B · Lire un texte avec l’IA", "M2": "Module 6C · Faire naître un problème", "M3": "Module 7 · Vérifier, enquêter", "N6": "Module 8 · Préparer ses cours", "M4": "Module 9A · Adapter l’accès, donner un feedback", "M5": "Module 9B · Corriger pour faire apprendre", "N7": "Module 10 · Accompagner toute l’année", "N8": "Module 11 · Penser l’IA en philosophe", "M6": "Module 12 · Séance réelle et engagement"};const ORDER=["N1", "N2", "N4", "N3", "N5", "O", "M1", "M2", "M3", "N6", "M4", "M5", "N7", "N8", "M6"];
(()=>{const q=new URLSearchParams(location.search);let k=q.get('atelier');if(!m[k])k=ORDER[0];let i=Math.max(0,Math.min((+q.get('s')||1)-1,m[k].length-1));
const $=id=>document.getElementById(id);const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pick=$('pick');ORDER.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=T[x];if(x===k)o.selected=true;pick.append(o)});
pick.addEventListener('change',()=>{k=pick.value;i=0;render()});
function render(){const sl=m[k][i];$('label').textContent=T[k]+' · bilan';$('slide-title').textContent=sl.title;
$('slide-body').innerHTML=esc(sl.body).replace(/\[([A-Z]{2,5})\]/g,'<a class="cite" href="sources.html#src-$1" target="_blank" rel="noopener">$1</a>');
$('counter').textContent=(i+1)+' / '+m[k].length;$('previous').disabled=i===0;$('next').textContent=i===m[k].length-1?'Module suivant →':'Suivante →';
$('back').href='index.html#atelier-'+k;document.title=T[k]+' — Diaporama';history.replaceState(null,'','?atelier='+k+'&s='+(i+1))}
function go(d){i+=d;if(i>=m[k].length){const n=ORDER[ORDER.indexOf(k)+1];if(n){k=n;i=0;pick.value=k}else i=m[k].length-1}if(i<0)i=0;render()}
$('previous').onclick=()=>go(-1);$('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target===pick)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}else if(e.key==='Home'){i=0;render()}else if(e.key==='End'){i=m[k].length-1;render()}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});
render()})();</script></body></html>
